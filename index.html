function go(name,params){
  clearInterval(timerId);
  route=Object.assign({name:name},params||{}); route.tab=TAB_MAP[name]||'lessons';
  $('app').classList.remove('still'); window.scrollTo(0,0); render();
}
function rerender(){ const y=window.scrollY; render(); $('app').classList.add('still'); window.scrollTo(0,y); }
function backAction(){
  if(route.name==='topic'){ const t=TOPICS.filter(x=>x.id===route.id)[0]; openLevel(t?t.lvl:gramLevel); }
  else if(route.name==='dialog'){ lessonMode='dlg'; go('lessons'); }
  else if(route.name==='testRun') quitTest();
}
if(tg&&tg.BackButton){ try{tg.BackButton.onClick(backAction);}catch(e){} }
function render(){
  const V={lessons:viewLessons,topic:viewTopic,dialog:viewDialog,tests:viewTests,testRun:viewTestRun,store:viewStore,dict:viewDict,profile:viewProfile};
  $('app').innerHTML=(V[route.name]||viewLessons)();
  $('nav').innerHTML=[['lessons','📚','Darslar'],['tests','✍️','Testlar'],['store','🛍',"Do'kon"],['dict','📖',"Lug'at"],['profile','👤','Profil']]
    .map(it=>'<button class="'+(route.tab===it[0]?'on':'')+'" onclick="go(\''+it[0]+'\')"><span class="ic">'+it[1]+'</span>'+it[2]+'</button>').join('');
  if(route.name==='dict') renderDictList();
  if(route.name==='testRun') renderQuestion();
  if(tg&&tg.BackButton){ try{ ['topic','dialog','testRun'].indexOf(route.name)>-1?tg.BackButton.show():tg.BackButton.hide(); }catch(e){} }
}
function hdr(title,sub,back){
  return '<div class="hdr">'+(back?'<button class="back" onclick="backAction()">‹</button>':'')+
    '<h1>'+title+(sub?'<span class="sub">'+sub+'</span>':'')+'</h1>'+
    '<button class="ibtn snd" onclick="toggleSound()">'+(state.sound?'🔊':'🔇')+'</button><span class="coin">🪙 '+state.coins+'</span></div>';
}

/* ---- progress helpers ---- */
const levelTopics=l=>TOPICS.filter(t=>t.lvl===l);
const isLearned=id=>state.learned.indexOf(id)>-1;
const levelLearned=l=>levelTopics(l).filter(t=>isLearned(t.id)).length;
const levelPercent=l=>{const a=levelTopics(l).length;return a?Math.round(levelLearned(l)/a*100):0;};
const coursePercent=()=>TOPICS.length?Math.round(state.learned.length/TOPICS.length*100):0;
function toggleLearned(id){
  const i=state.learned.indexOf(id);
  if(i<0){ state.learned.push(id); const a=addXp(15); Snd.coin(); hap.ok(); toast('+'+a+' XP  🪙 +'+a); }
  else state.learned.splice(i,1);
  saveState(); rerender();
}
function ringHTML(pct,size,st){
  const r=(size-st)/2,c=2*Math.PI*r,off=c-c*pct/100,m=size/2;
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'+
   '<circle cx="'+m+'" cy="'+m+'" r="'+r+'" stroke="rgba(255,255,255,.28)" stroke-width="'+st+'" fill="none"/>'+

const oc=(k,c)=>'opt '+(c||'')+(run.gone.indexOf(k)>-1?' gone':'');
function refreshBoosts(){
  const e=$('bst'); if(!e||!run) return; const q=run.qs[run.i]; let h='';
  if(q.t==='mc'&&state.inv.hint>0&&!run.done&&!run.gone.length) h+='<button class="chip mini" onclick="useHint()">✂️ 50/50 ×'+state.inv.hint+'</button>';

  if(doubleOn()) h+='<span class="chip mini on">⚡ ×2 XP</span>';
  e.innerHTML=h;
}
function useHint(){
  const q=run.qs[run.i]; if(run.done||q.t!=='mc'||state.inv.hint<1||run.gone.length) return;
  run.gone=shuffle(q.o.map((_,k)=>k).filter(k=>k!==q.a)).slice(0,2); state.inv.hint--; saveState();
  if(run.gone.indexOf(run.sel)>-1) run.sel=null;
  q.o.forEach((_,k)=>{const b=$('opt'+k); if(b) b.className=oc(k,k===run.sel?'sel':'');}); refreshBoosts();
}
function useFreeze(){
  if(run.done||run.frozen||state.inv.freeze<1) return; run.frozen=true; state.inv.freeze--; saveState();
  const t=$('tm'); if(t) t.classList.add('frz'); refreshBoosts(); toast('❄️ Vaqt to\'xtatildi');
}
function useLife(){
  if(state.inv.life<1||!run) return; state.inv.life--; state.totalAnswered--; saveState(); toast('❤️ Qayta urinib ko\'ring!'); renderQuestion();
}
function setBar(){ const i=$('tmi'); if(i) i.style.width=Math.max(0,run.left/TIME*100)+'%'; }
function renderQuestion(){
  const box=$('quizBox'); if(!box||!run||run.finished) return;
  clearInterval(timerId); const q=run.qs[run.i];
  run.sel=null; run.done=false; run.gone=[]; run.frozen=false; run.left=TIME; orderPick=[];
  let h='<div class="qmeta">Savol '+(run.i+1)+' / '+run.qs.length+'</div>'+(isTimed()?'<div class="timer" id="tm" style="margin-top:8px"><i id="tmi"></i></div>':'')+'<div class="boosts" id="bst" style="margin-top:8px"></div><div class="qtext">'+esc(q.q)+'</div>';
  if(q.t==='mc') h+=q.o.map((o,i)=>'<button class="opt" id="opt'+i+'" onclick="selOpt('+i+')">'+esc(o)+'</button>').join('');
  else if(q.t==='fill') h+='<input id="fillInp" class="inp" placeholder="Javobni yozing..." autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key===\'Enter\'){checkAnswer();}">';
  else h+='<div class="ansarea" id="ansArea"></div><div class="chips" style="padding:4px 0 10px">'+q.w.map((w,i)=>'<button class="chip" id="w'+i+'" onclick="pickWord('+i+')">'+esc(w)+'</button>').join('')+'</div>';
  h+='<div id="fb"></div><button data-q class="btn" id="chkBtn" onclick="checkAnswer()">Tekshirish</button>';
  box.innerHTML=h; refreshBoosts(); if(q.t==='order') renderAnsArea();
  if(isTimed()){ setBar(); timerId=setInterval(function(){ if(!run||run.done){clearInterval(timerId);return;} if(run.frozen) return; run.left--; setBar(); if(run.left<=0){clearInterval(timerId);checkAnswer(true);} },1000); }
  if(q.t==='fill') setTimeout(function(){const el=$('fillInp'); if(el) el.focus();},120);
}
function selOpt(i){ if(run.done) return; run.sel=i; run.qs[run.i].o.forEach((_,k)=>{const b=$('opt'+k); if(b) b.className=oc(k,k===i?'sel':'');}); }
function pickWord(i){ if(run.done||orderPick.indexOf(i)>-1) return; orderPick.push(i); const b=$('w'+i); if(b) b.style.opacity='.35'; renderAnsArea(); }
function unpickWord(p){ if(run.done) return; const i=orderPick[p]; orderPick.splice(p,1); const b=$('w'+i); if(b) b.style.opacity='1'; renderAnsArea(); }
function renderAnsArea(){
  const a=$('ansArea'); if(!a||!run) return; const q=run.qs[run.i];
  a.innerHTML=orderPick.length?orderPick.map((idx,p)=>'<button class="chip" onclick="unpickWord('+p+')">'+esc(q.w[idx])+'</button>').join(''):'<span class="muted" style="padding:8px">So\'zlarni to\'g\'ri tartibda bosing...</span>';
}
function checkAnswer(forced){
  if(!run||run.done) return; forced=forced===true;
  const q=run.qs[run.i]; let ok=false,ca='';
  if(q.t==='mc'){
    if(run.sel===null&&!forced){toast('Iltimos, javobni tanlang');return;}
    ok=run.sel===q.a; ca=q.o[q.a];
    q.o.forEach((_,k)=>{const b=$('opt'+k); if(b) b.className=oc(k,k===q.a?'good':k===run.sel?'bad':'');});
  } else if(q.t==='fill'){
    const el=$('fillInp'),v=el?el.value.trim():'';
    if(!v&&!forced){toast('Iltimos, javobni yozing');return;}
    ok=!!v&&q.a.some(a=>low(a)===low(v)); ca=q.a[0]; if(el) el.disabled=true;
  } else {
    if(!orderPick.length&&!forced){toast("Iltimos, so'zlarni tanlang");return;}
    ok=low(orderPick.map(i=>q.w[i]).join(' '))===low(q.a); ca=q.a;
  }
  clearInterval(timerId); run.done=true; if(ok) run.correct++;
  state.totalAnswered++; if(ok) state.totalCorrect++; saveState();
  if(ok){Snd.ok();hap.ok();}else{Snd.bad();hap.bad();}
  $('fb').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><b style="display:block">'+(ok?"✅ To'g'ri!":(forced&&run.left<=0?'⏱ Vaqt tugadi':'❌ Xato'))+'</b>'+(ok?'':'To\'g\'ri javob: <b>'+esc(ca)+'</b><br>')+(q.e?'<span style="color:var(--hint)">'+esc(q.e)+'</span>':'')+
    (!ok&&state.inv.life>0?'<div style="margin-top:8px"><button class="btn ghost small" onclick="useLife()">❤️ Extra Life: qayta urinish ('+state.inv.life+')</button></div>':'')+'</div>';
  const b=$('chkBtn'); b.textContent=run.i+1<run.qs.length?'Keyingi savol →':"Natijani ko'rish 🏁"; b.className='btn '+(ok?'ok':''); b.setAttribute('onclick','nextQuestion()');
  refreshBoosts();
}
function nextQuestion(){
  if(!run) return;
  if(run.i+1<run.qs.length){ run.i++; renderQuestion(); const b=$('quizBox'); if(b&&b.scrollIntoView) b.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  run.finished=true; run.dbl=doubleOn();
  const sc=Math.round(run.correct/run.qs.length*100), prev=state.tests[run.test.id];
  state.tests[run.test.id]={best:prev?Math.max(prev.best,sc):sc,tries:prev?prev.tries+1:1};
  run.earned=addXp(run.correct*10); saveState();
  if(sc>=70){Snd.coin();hap.ok();}else hap.warn();
  go('testRun',{id:run.test.id});
}
function quitTest(){
  if(!run){go('tests');return;}
  const ok=function(){ clearInterval(timerId); run=null; go('tests'); };
  if(run.finished) return ok();
  if(tg&&tg.showConfirm){ try{ tg.showConfirm('Testni tark etmoqchimisiz? Natija saqlanmaydi.',function(y){if(y)ok();}); return; }catch(e){} }
  if(confirm('Testni tark etmoqchimisiz? Natija saqlanmaydi.')) ok();
}

/* ---- PROFILE ---- */
function viewProfile(){
  const th=themeById(state.theme); let h='<div class="view">'+hdr('Profil','Natijalaringiz va sozlamalar');
  h+='<div class="card" style="text-align:center;padding:24px 16px"><div class="ava" style="width:80px;height:80px;margin:0 auto 12px;font-size:30px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btntext)">'+(TG_USER&&TG_USER.photo_url?'<img src="'+esc(TG_USER.photo_url)+'">':esc(USER_INITIALS))+'</div><h3 style="margin:0 0 2px;font-size:19px">'+esc(USER_NAME)+'</h3><div class="muted">'+(TG_USER&&TG_USER.username?'@'+esc(TG_USER.username):'Telegram foydalanuvchisi')+' • '+levelOf()+'-daraja</div></div>';
  h+='<div class="stats"><div class="stat"><b>'+state.xp+'</b><span>XP</span></div><div class="stat"><b>🔥 '+state.streak+'</b><span>Kun seriya</span></div><div class="stat"><b>🪙 '+state.coins+'</b><span>Tanga</span></div></div>';
  h+='<div class="card"><h3>⚙️ Sozlamalar</h3><div class="row" style="justify-content:space-between;padding:6px 0"><span>Ovoz effektlari <span class="muted" id="sndTxt">'+(state.sound?'Yoqilgan':"O'chirilgan")+'</span></span><button class="ibtn snd" onclick="toggleSound()">'+(state.sound?'🔊':'🔇')+'</button></div>'+
    '<div class="row" style="justify-content:space-between;padding:6px 0"><span>Mavzu <span class="muted">'+th.name+'</span></span><button class="btn small ghost" onclick="go(\'store\')">Do\'kon ›</button></div></div>';
  const done=Object.keys(state.tests).length, row=(a,b)=>'<div class="row" style="justify-content:space-between;padding:6px 0"><span class="muted">'+a+'</span><b>'+b+'</b></div>';
  h+='<div class="card"><h3>📊 Statistika</h3>'+row("O'rganilgan mavzular",state.learned.length+' / '+TOPICS.length)+row('Topshirilgan testlar',done+' / '+TESTS.length)+row('Jami savollar',state.totalAnswered)+row("To'g'ri javoblar",state.totalCorrect)+row('Aniqlik',state.totalAnswered?Math.round(state.totalCorrect/state.totalAnswered*100)+'%':'—')+'</div>';
  h+='<div class="sect">Darajalar bo\'yicha</div>'+['A1','A2','B1','B2'].map(l=>'<div class="card" style="padding:12px 16px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">'+l+' darajasi</b><span class="muted">'+levelLearned(l)+'/'+levelTopics(l).length+'</span></div><div class="bar"><i style="width:'+levelPercent(l)+'%"></i></div></div>').join('');
  return h+'<div style="padding:10px 16px 24px"><button class="btn ghost" onclick="resetProgress()">🗑 Progressni tozalash</button><p class="muted" style="text-align:center">Tanga, mavzular va kuchaytirgichlar saqlanib qoladi.</p></div></div>';
}
function resetProgress(){
  const go_=function(){ Object.assign(state,{learned:[],tests:{},xp:0,streak:0,lastDay:null,totalCorrect:0,totalAnswered:0}); saveState(); updateStreak(); rerender(); };
  const m="Darslar, testlar va XP o'chiriladi. Davom etilsinmi?";
  if(tg&&tg.showConfirm){ try{ tg.showConfirm(m,function(y){if(y)go_();}); return; }catch(e){} }
  if(confirm(m)) go_();
}

/* ===== INIT ===== */
loadState(); applyTheme(state.theme); render();
if(tg){ try{ tg.onEvent('themeChanged',function(){ if(state.theme==='classic') applyTheme('classic'); }); }catch(e){} }
</script>
