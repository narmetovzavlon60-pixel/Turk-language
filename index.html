<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TÖMER Türkçe — O'zbeklar uchun</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#f2f2f7);--sec:var(--tg-theme-secondary-bg-color,#fff);
  --text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8a8e);
  --link:var(--tg-theme-link-color,#2481cc);--btn:var(--tg-theme-button-color,#2481cc);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --g1:var(--btn);--g2:color-mix(in srgb,var(--btn) 62%,#000);
  --ok:#34c759;--bad:#ff3b30;--line:rgba(128,128,128,.2);
  --glass:rgba(255,255,255,.72);--shadow:0 1px 3px rgba(0,0,0,.06);
  --top:calc(max(env(safe-area-inset-top),var(--tsa-t,0px)) + var(--tca-t,0px));
  --bot:max(env(safe-area-inset-bottom),var(--tsa-b,0px));
}
:root[data-dark]{--glass:rgba(24,24,28,.7);--shadow:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
@supports(color:color-mix(in srgb,red 50%,blue)){:root{--glass:color-mix(in srgb,var(--bg) 70%,transparent)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + var(--bot));-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;transition:background .35s,color .35s}
input{-webkit-user-select:text;user-select:text}
.hdr{position:sticky;top:0;z-index:60;padding:calc(10px + var(--top)) 16px 10px;display:flex;align-items:center;gap:10px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--line)}
.hdr h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px;flex:1;min-width:0}
.hdr .sub{font-size:12px;color:var(--hint);font-weight:500;display:block;letter-spacing:0}
.back,.ibtn{background:rgba(128,128,128,.14);border:0;color:var(--link);font-size:17px;min-width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0 10px;font-weight:700;gap:4px}
.ibtn{font-size:15px;color:var(--text)}
.view>*{animation:up .38s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(n+5){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:var(--sec);border-radius:18px;padding:14px 16px;margin:10px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700}.card p{margin:0 0 8px}
.muted{color:var(--hint);font-size:13px}
.btn{background:var(--btn);color:var(--btntext);border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;width:100%;font-family:inherit;transition:transform .12s,opacity .12s}
.btn:active,.item:active,.chip:active,.opt:active,.seg button:active{transform:scale(.97);opacity:.85}
.btn.ghost{background:transparent;color:var(--link);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.btn.ok{background:var(--ok);color:#fff}.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.bar{height:7px;border-radius:4px;background:rgba(128,128,128,.2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--btn);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.g>i{background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:20px;background:var(--sec);color:var(--text);font-size:13px;font-weight:600;border:0;white-space:nowrap;font-family:inherit;transition:.2s}
.chip.on{background:var(--btn);color:var(--btntext)}.chip.mini{padding:6px 12px;font-size:12px}
.seg{display:flex;margin:10px 16px;padding:3px;border-radius:12px;background:rgba(128,128,128,.16)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:600 13px inherit;font-family:inherit;color:var(--hint);transition:.2s}
.seg button.on{background:var(--sec);color:var(--text);box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--sec);border-radius:16px;margin:8px 16px;transition:transform .12s;box-shadow:var(--shadow)}
.item .ic{flex:0 0 40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;background:rgba(128,128,128,.13)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.item .tx span{display:block;font-size:12.5px;color:var(--hint);margin-top:2px}.item .ar{color:var(--hint);font-size:16px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(128,128,128,.14);color:var(--hint)}
.badge.a1{background:rgba(227,10,23,.14);color:#e5303c}.badge.a2{background:rgba(255,149,0,.16);color:#e08600}
.badge.b1{background:rgba(52,199,89,.16);color:#2fae55}.badge.b2{background:rgba(36,129,204,.18);color:#3d93e0}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--sec);color:var(--text);font-size:15px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--btn)}
.nav{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--bot));z-index:100;display:flex;padding:5px;border-radius:26px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.14)}
.nav button{flex:1;background:none;border:0;color:var(--hint);font:600 10px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:20px;transition:.25s}
.nav button.on{color:var(--btn);background:rgba(128,128,128,.14)}
.nav .ic{font-size:20px;line-height:1;transition:transform .25s}.nav button.on .ic{transform:translateY(-1px) scale(1.12)}
.hero{margin:12px 16px;border-radius:24px;padding:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btntext);position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.hero:after{content:"☪";position:absolute;right:-6px;bottom:-34px;font-size:120px;opacity:.12}
.hero h2{margin:0 0 2px;font-size:18px;font-weight:800}.hero p{margin:0;font-size:13px;opacity:.9}
.ava{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex:0 0 auto;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 16px}
.stat{background:var(--sec);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--hint);font-weight:600}
.gram{background:var(--sec);border-radius:16px;padding:14px 15px;margin:8px 16px;font-size:14.5px;line-height:1.65;box-shadow:var(--shadow);-webkit-user-select:text;user-select:text}
.gram b{color:var(--link)}.gram code{background:rgba(128,128,128,.16);padding:1px 6px;border-radius:6px;font-size:13.5px}
.ex{background:var(--sec);border-radius:16px;margin:10px 16px;overflow:hidden;box-shadow:var(--shadow)}
.ex .line{padding:11px 15px;border-bottom:1px solid var(--line)}.ex .line:last-child{border-bottom:0}
.ex .tr{font-weight:700;font-size:14.5px}.ex .uz{font-size:13px;color:var(--hint);margin-top:2px}
.dline{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.dline .who{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(128,128,128,.15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--hint)}
.dline .body{flex:1}.dline .tr{font-size:14.5px;font-weight:600}.dline .uz{font-size:13px;color:var(--hint);margin-top:2px;display:none}
.dline.show .uz{display:block;animation:up .2s both}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font:500 14.5px inherit;font-family:inherit;margin-bottom:9px;transition:.15s}
.opt.sel{border-color:var(--btn);background:rgba(36,129,204,.1)}.opt.good{border-color:var(--ok);background:rgba(52,199,89,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,59,48,.12)}.opt.gone{opacity:.2;pointer-events:none;text-decoration:line-through}
.qtext{font-size:16.5px;font-weight:700;line-height:1.45;margin:6px 0 14px}.qmeta{font-size:12px;color:var(--hint);font-weight:700}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px;animation:pop .2s}
.fb.good{background:rgba(52,199,89,.14);border-left:4px solid var(--ok)}.fb.bad{background:rgba(255,59,48,.12);border-left:4px solid var(--bad)}
.ansarea{min-height:52px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.ansarea .chip{background:var(--btn);color:var(--btntext)}
.ring{position:relative;flex:0 0 auto}.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.sect{padding:16px 18px 4px;font-size:13px;font-weight:700;color:var(--hint)}
.empty{text-align:center;padding:44px 24px;color:var(--hint);font-size:14px}
.wod{margin:10px 16px;border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g2),var(--g1))}
.wod:before{content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;border-radius:50%;box-shadow:inset -24px 8px 0 0 rgba(255,255,255,.2)}
.wod .w{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:10px}.wod .t{font-size:15px;opacity:.92}
.pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.24);display:inline-block}
.coin{background:rgba(255,170,0,.18);color:#e69500;font-weight:800;font-size:13px;padding:7px 11px;border-radius:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 16px}
.th{background:var(--sec);border-radius:18px;padding:10px;box-shadow:var(--shadow);border:2px solid transparent;transition:.2s}
.th.act{border-color:var(--btn)}
.sw{height:62px;border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.sw i{position:absolute;left:8px;right:8px;bottom:8px;height:16px;border-radius:6px}.sw u{position:absolute;left:8px;top:8px;width:50%;height:8px;border-radius:4px;opacity:.85}
.th b{display:block;font-size:13.5px}.th .btn{margin-top:8px;padding:8px;font-size:12.5px;border-radius:10px}
.timer{height:5px;border-radius:3px;background:rgba(128,128,128,.2);overflow:hidden;margin-bottom:10px}.timer i{display:block;height:100%;background:var(--bad);width:100%;transition:width 1s linear}
.timer.frz i{background:#5ac8fa}
.boosts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(14px + var(--top));transform:translate(-50%,-90px);z-index:300;background:rgba(30,30,34,.92);color:#fff;padding:10px 16px;border-radius:16px;font-size:13.5px;font-weight:600;max-width:88%;text-align:center;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#toast.on{transform:translate(-50%,0)}
#app.still .view>*{animation:none}
</style>

<body>
<div id="app"></div>
<div class="nav" id="nav"></div>
<div id="toast"></div>

<script>
/* ===== TELEGRAM MINI APP INIT ===== */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
function applySafe(){
  if(!tg) return;
  const s=document.documentElement.style, a=tg.safeAreaInset||{}, c=tg.contentSafeAreaInset||{};
  s.setProperty('--tsa-t',(a.top||0)+'px'); s.setProperty('--tsa-b',(a.bottom||0)+'px'); s.setProperty('--tca-t',(c.top||0)+'px');
}
if (tg) {
  try{tg.ready();}catch(e){} try{tg.expand();}catch(e){} try{tg.enableClosingConfirmation();}catch(e){}
  try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch(e){}
  applySafe();
  ['safeAreaChanged','contentSafeAreaChanged','viewportChanged'].forEach(function(ev){try{tg.onEvent(ev,applySafe);}catch(e){}});
}
const TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
const USER_NAME = TG_USER ? ((TG_USER.first_name||'')+(TG_USER.last_name?' '+TG_USER.last_name:'')).trim() : "O'quvchi";
const USER_INITIALS = TG_USER ? (((TG_USER.first_name||'?')[0]||'?')+((TG_USER.last_name||'')[0]||'')).toUpperCase() : "O'Q";

/* ===== HAPTICS ===== */
const hap = {
  _h(f){ try{ if(tg&&tg.HapticFeedback) f(tg.HapticFeedback); else if(navigator.vibrate) navigator.vibrate(8); }catch(e){} },
  light(){ this._h(function(h){h.impactOccurred('light');}); },
  sel(){ this._h(function(h){h.selectionChanged();}); },
  ok(){ this._h(function(h){h.notificationOccurred('success');}); },
  bad(){ this._h(function(h){h.notificationOccurred('error');}); },
  warn(){ this._h(function(h){h.notificationOccurred('warning');}); }
};

/* ===== STATE ===== */
const STORE_KEY = 'tomer_uzbek_v1';
const DEFAULTS = ()=>({learned:[],tests:{},xp:0,streak:0,lastDay:null,totalCorrect:0,totalAnswered:0,
  coins:50,themes:['classic'],theme:'classic',inv:{shield:0,hint:0,freeze:0,life:0},doubleUntil:0,sound:true});
let state = DEFAULTS();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw), d = DEFAULTS();
      if(p.coins === undefined) p.coins = p.xp || 0;      // eski foydalanuvchilar: tangalar = XP
      state = Object.assign(d, p);
      state.inv = Object.assign(d.inv, p.inv || {});
      if(!Array.isArray(state.learned)) state.learned=[];
      if(!state.tests || typeof state.tests!=='object') state.tests={};
      if(!Array.isArray(state.themes)||state.themes.indexOf('classic')<0) state.themes=['classic'].concat(state.themes||[]);
    }
  }catch(e){}
  updateStreak();
}
function saveState(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){} }
const dayNum = s => Math.round(Date.parse(s+'T00:00:00Z')/86400000);
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(state.lastDay === today) return;
  if(!state.lastDay) state.streak = 1;
  else {
    const missed = dayNum(today) - dayNum(state.lastDay) - 1;
    if(missed <= 0) state.streak++;
    else if(state.inv.shield >= missed){ state.inv.shield -= missed; state.streak++; setTimeout(function(){toast('🛡 Streak Shield seriyangizni saqlab qoldi!');},600); }
    else state.streak = 1;
  }
  state.lastDay = today; saveState();
}
const doubleOn = () => state.doubleUntil > Date.now();
function addXp(n){ const a = n * (doubleOn()?2:1); state.xp += a; state.coins += a; saveState(); return a; }
const levelOf = () => Math.floor(state.xp/200)+1;

/* ===== SOUND (Web Audio API) ===== */
const Snd = (function(){
  let ctx=null, master=null;
  function ready(){
    if(!state.sound) return false;
    try{
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
        ctx=new AC(); master=ctx.createGain(); master.gain.value=.55; master.connect(ctx.destination); }
      if(ctx.state==='suspended') ctx.resume();
      return true;
    }catch(e){ return false; }
  }
  function tone(f,t,d,type,v,to){
    const o=ctx.createOscillator(), g=ctx.createGain(), n=ctx.currentTime+t;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,n);
    if(to) o.frequency.exponentialRampToValueAtTime(to,n+d);
    g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(v,n+.012); g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g); g.connect(master); o.start(n); o.stop(n+d+.03);
  }
  return {
    click(){ if(ready()) tone(1200,0,.045,'sine',.1,800); },
    tab(){ if(ready()){ tone(700,0,.05,'sine',.1); tone(950,.04,.06,'sine',.08); } },
    ok(){ if(ready()){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*.075,.35,'triangle',.16); }); } },
    bad(){ if(ready()){ tone(220,0,.28,'sine',.22,150); tone(165,.05,.3,'sine',.14,110); } },
    coin(){ if(ready()){ tone(988,0,.07,'square',.06); tone(1319,.08,.4,'square',.06); tone(2637,.1,.25,'sine',.05); } },
    sweep(){ if(ready()){ tone(260,0,.45,'sine',.14,1500); tone(390,.05,.4,'triangle',.06,2200); } }
  };
})();
function toggleSound(){
  state.sound = !state.sound; saveState();
  if(state.sound) Snd.click();
  document.querySelectorAll('.snd').forEach(function(b){ b.textContent = state.sound?'🔊':'🔇'; });
  const t=document.getElementById('sndTxt'); if(t) t.textContent = state.sound?'Yoqilgan':"O'chirilgan";
}
function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},2200);
}
/* Global tap feedback: sound + haptic */
document.addEventListener('click',function(e){
  const el=e.target.closest('button,.item,.chip,.opt,.th'); if(!el||el.disabled||el.hasAttribute('data-q')||el.classList.contains('snd')) return;
  if(el.closest('.nav')){ Snd.tab(); hap.sel(); }
  else if(el.classList.contains('chip')||el.classList.contains('opt')||el.closest('.seg')){ Snd.click(); hap.sel(); }
  else { Snd.click(); hap.light(); }
},true);

/* ===== THEMES (15) ===== */
/* [id, nom, narx, qorong'i, bg, sec, text, hint, accent, accent2, btntext] */
const THEMES = [
 ['classic','Telegram Classic',0,0],
 ['amoled','Dark AMOLED',120,1,'#000000','#121214','#f5f5f7','#8e8e93','#0a84ff','#0040dd','#fff'],
 ['crimson','Crimson Red',100,0,'#fff3f3','#ffffff','#2a0a0d','#9a6a6e','#e30a17','#8f0610','#fff'],
 ['emerald','Emerald Green',100,0,'#edf9f2','#ffffff','#0b2a1b','#5f8a74','#0f9d58','#0a6b3c','#fff'],
 ['gold','Sunset Gold',140,0,'#fff7e6','#fffdf7','#3a2705','#9c8350','#d98a00','#b04a00','#fff'],
 ['neon','Cyberpunk Neon',250,1,'#0b0614','#170c2a','#f4eaff','#9a86c4','#ff2bd6','#00c8e6','#fff'],
 ['ocean','Ocean Blue',120,0,'#e8f5ff','#ffffff','#062a45','#5b86a3','#0a84d6','#0b4f9c','#fff'],
 ['pink','Pastel Pink',120,0,'#fff0f5','#ffffff','#3d1f2b','#a8788a','#e86a9a','#c2467a','#fff'],
 ['mint','Forest Mint',140,0,'#eef8f3','#fbfffd','#153027','#6b9484','#3eb489','#1f8a66','#fff'],
 ['purple','Deep Purple',180,1,'#120a24','#1e1338','#efe8ff','#9b8bc2','#8b5cf6','#5b21b6','#fff'],
 ['cappu','Cappuccino',140,0,'#f4ece3','#fbf6f0','#3b2a1e','#957d68','#8b5e3c','#5a3822','#fff'],
 ['nord','Nord Ice',180,1,'#2e3440','#3b4252','#eceff4','#9aa5bd','#88c0d0','#5e81ac','#2e3440'],
 ['midnight','Midnight Blue',200,1,'#0a1128','#121c3d','#e8eefc','#7f8fb8','#3d7bff','#1c3fa8','#fff'],
 ['violet','Sunset Violet',160,0,'#fbeff8','#ffffff','#2e1236','#a07aa6','#b84fd1','#f0647a','#fff'],
 ['white','Minimal White',80,0,'#ffffff','#f4f4f6','#111111','#86868b','#111111','#3a3a3c','#fff']

const themeById = id => THEMES.filter(function(t){return t.id===id;})[0] || THEMES[0];
function applyTheme(id, silent){
  const t = themeById(id), r = document.documentElement, s = r.style;
  ['--bg','--sec','--text','--hint','--link','--btn','--btntext','--g1','--g2'].forEach(function(k){ s.removeProperty(k); });
  r.removeAttribute('data-dark'); r.removeAttribute('data-theme');
  if(t.id!=='classic'){
    const c=t.c; s.setProperty('--bg',c[0]); s.setProperty('--sec',c[1]); s.setProperty('--text',c[2]); s.setProperty('--hint',c[3]);
    s.setProperty('--link',c[4]); s.setProperty('--btn',c[4]); s.setProperty('--g1',c[4]); s.setProperty('--g2',c[5]); s.setProperty('--btntext',c[6]);
    r.setAttribute('data-theme',t.id); if(t.dark) r.setAttribute('data-dark','');
  }
  if(tg){ try{ const bg = t.id==='classic' ? tg.themeParams.bg_color : t.c[0]; if(bg){ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor&&tg.setBottomBarColor(bg);} }catch(e){} }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}

},
{
id:'a1-16', lvl:'A1', n:16, tr:'Şimdiki Zamanın Olumsuz ve Soru Şekli', uz:"Hozirgi zamonning inkor va so'roq shakli",
body:`<b>Inkor shakli:</b> o'zak + <code>-mı / -mi / -mu / -mü</code> + <code>-yor</code> + shaxs qo'shimchasi.<br>
<code>gel- → gelmiyorum</code>, <code>oku- → okumuyorum</code>, <code>yap- → yapmıyorum</code>, <code>gör- → görmüyorum</code>.
<br><br><b>So'roq shakli:</b> so'roq qo'shimchasi <b>shaxs qo'shimchasidan oldin</b> keladi.<br>
<code>geliyor muyum?</code>, <code>geliyor musun?</code>, <code>geliyor mu?</code>, <code>geliyor muyuz?</code>, <code>geliyor musunuz?</code>, <code>geliyorlar mı?</code>
<br><br>O'zbek tilidagi "kelyapmanmi?", "kelyapsanmi?" kabi shakllarga mos keladi.`,
ex:[["Gelmiyorum.","Kelmayapman."],["Anlamıyorum.","Tushunmayapman."],["Bilmiyorum.","Bilmayapman."],["Çalışmıyor.","Ishlamayapti."],["Geliyor musun?","Kelyapsanmi?"],["Ne yapıyorsun?","Nima qilyapsan?"],["Nereye gidiyorsun?","Qayerga ketyapsan?"],["Neden gülmüyorsun?","Nega kulmayapsan?"]]
},
{
id:'a1-17', lvl:'A1', n:17, tr:'Kişi Ekleri', uz:"Shaxs-son qo'shimchalari",
body:`Turk tilida shaxs qo'shimchalari zamonlarga qarab o'zgaradi. Eng muhim uchta jadval:
<br><br><b>1) Hozirgi zamon (-yor):</b><br>
<code>-um</code> (men) • <code>-sun</code> (sen) • <code>—</code> (u) • <code>-uz</code> (biz) • <code>-sunuz</code> (siz) • <code>-lar</code> (ular)
<br><br><b>2) O'tgan zamon (-dı):</b><br>
<code>-m</code> (men) • <code>-n</code> (sen) • <code>—</code> (u) • <code>-k</code> (biz) • <code>-niz</code> (siz) • <code>-lar</code> (ular)
<br><br><b>3) Kelasi zamon (-acak):</b><br>
<code>-ım</code> (men) • <code>-sın</code> (sen) • <code>—</code> (u) • <code>-ız</code> (biz) • <code>-sınız</code> (siz) • <code>-lar</code> (ular)
<br><br>O'zbek tilidan farqli o'laroq, turk tilida <b>u</b> va <b>ular</b> uchun ko'pincha qo'shimcha ishlatilmaydi yoki faqat <code>-lar</code> qo'shiladi.`,
ex:[["Ben öğrenciyim.","Men o'quvchiman."],["Sen öğrencisin.","Sen o'quvchisan."],["O öğrenci.","U o'quvchi."],["Biz öğrenciyiz.","Biz o'quvchimiz."],["Siz öğrencisiniz.","Siz o'quvchisiz."],["Onlar öğrenci.","Ular o'quvchi."],["Ben geldim.","Men keldim."],["Sen geldin.","Sen kelding."]]
},
{
id:'a1-18', lvl:'A1', n:18, tr:'Ek-Fiil: İsim Cümlelerinde Şimdiki Zaman', uz:"Ot gaplarda hozirgi zamon (Ben öğrenciyim)",
body:`Turk tilida "men o'quvchiman" kabi gaplarda fe'l ishlatilmaydi. Buning o'rniga <b>shaxs qo'shimchasi</b> to'g'ridan-to'g'ri otga qo'shiladi.
<br><br><b>Qo'shimchalar:</b><br>
<code>-(y)ım</code> (men) → <code>öğrenciyim</code><br>
<code>-sın</code> (sen) → <code>öğrencisin</code><br>
<code>—</code> (u) → <code>öğrenci</code><br>
<code>-(y)ız</code> (biz) → <code>öğrenciyiz</code><br>
<code>-sınız</code> (siz) → <code>öğrencisiniz</code><br>
<code>-lar</code> (ular) → <code>öğrenciler</code>
<br><br><b>Inkor shakli:</b> <code>değil</code> so'zi bilan yasaladi: <code>Ben öğrenci değilim</code> — "Men o'quvchi emasman".`,
ex:[["Ben öğrenciyim.","Men o'quvchiman."],["Sen doktorsun.","Sen shifokorsan."],["O öğretmen.","U o'qituvchi."],["Biz mutluyuz.","Biz baxtlimiz."],["Siz hazırsınız.","Siz tayyorsiz."],["Onlar yorgun.","Ular charchagan."],["Ben hasta değilim.","Men kasal emasman."],["O iyi bir insan.","U yaxshi inson."]]
},
{
id:'a1-19', lvl:'A1', n:19, tr:'Emir Kipi', uz:'Buyruq mayli',
body:`Buyruq mayli <b>so'z o'zagiga</b> hech qanday qo'shimcha qo'shmasdan yasaladi (sen uchun):
<br><br><code>gel!</code> (kel!) • <code>git!</code> (bor!) • <code>bak!</code> (qara!) • <code>oku!</code> (o'qi!) • <code>yap!</code> (qil!)
<br><br><b>Xushmuomala (siz) shakli:</b> <code>-ın / -in / -un / -ün</code> yoki <code>-yın / -yin</code>:<br>
<code>gelin!</code> • <code>gidin!</code> • <code>bakın!</code> • <code>okuyun!</code> • <code>yapın!</code>
<br><br><b>Inkor shakli:</b> <code>-ma / -me</code>:<br>
<code>gelme!</code> (kelma!) • <code>gelmeyin!</code> (kelmang!) • <code>yapma!</code> (qilma!)
<br><br>O'zbek tilidagi buyruq mayli bilan deyarli bir xil, faqat xushmuomala shakli qo'shimcha bilan yasaladi.`,
ex:[["Gel buraya!","Bu yerga kel!"],["Lütfen oturun.","Iltimos, o'tiring."],["Bak!","Qara!"],["Dinleyin.","Tinglang."],["Yapma!","Qilma!"],["Gelmeyin.","Kelmang."],["Bana yardım et.","Menga yordam ber."],["Kapıyı aç.","Eshikni och."]]
},
{
id:'a1-20', lvl:'A1', n:20, tr:'İstek Kipi: A1 Seviyesi (-alım / -elim)', uz:"Xohish mayli (-aylik / -ay)",
body:`Xohish mayli <b>"keling, ... qilaylik"</b> yoki <b>"... qilay"</b> ma'nosini beradi.
<br><br><b>"Biz" shakli:</b> <code>-alım / -elim</code> → <code>gidelim</code> (ketaylik), <code>yapalım</code> (qilaylik), <code>okuyalım</code> (o'qiyik).
<br><br><b>"Men" shakli:</b> <code>-ayım / -eyim</code> → <code>gideyim</code> (ketay), <code>yapayım</code> (qilay), <code>bakayım</code> (qaray).
<br><br>So'z unli bilan tugasa, orasiga <b>y</b> qo'shiladi: <code>oku- → okuyalım</code>, <code>bekle- → bekleyelim</code>.
<br><br>O'zbek tilidagi "-aylik" va "-ay" qo'shimchalariga to'liq mos keladi.`,
ex:[["Hadi gidelim!","Kel, ketaylik!"],["Yemek yiyelim.","Ovqat yeylik."],["Türkçe çalışalım.","Turkcha o'qiyik."],["Sinemaya gidelim mi?","Kinoga boraylikmi?"],["Bir kahve içeyim.","Bir qahva ichay."],["Sana yardım edeyim.","Senga yordam beray."],["Biraz dinlenelim.","Biroz dam olaylik."],["Başlayalım!","Boshlaylik!"]]
},

/* ==================== A2 ==================== */
{
id:'a2-1', lvl:'A2', n:1, tr:'İyelik Ekleri', uz:"Egalik qo'shimchalari",
body:`Egalik qo'shimchalari <b>kimning?</b> savoliga javob beradi va otga qo'shiladi.
<br><br><code>benim evim</code> — mening uyim<br>
<code>senin evin</code> — sening uying<br>
<code>onun evi</code> — uning uyi<br>
<code>bizim evimiz</code> — bizning uyimiz<br>
<code>sizin eviniz</code> — sizning uyingiz<br>
<code>onların evi / evleri</code> — ularning uyi
<br><br><b>Muhim qoida:</b> so'z unli bilan tugasa, 3-shaxsda orasiga <b>s</b> qo'shiladi: <code>araba → arabası</code>, <code>kapı → kapısı</code>.
<br><br>Ko'plikda: <code>ev → evlerim</code> (uylarim), <code>evlerimiz</code> (uylarimiz).
<br><br>O'zbek tilidagi "-im, -ing, -i, -imiz, -ingiz, -i" qo'shimchalariga to'liq mos keladi.`,
ex:[["Benim adım Ali.","Mening ismim Ali."],["Senin kitabın nerede?","Sening kitobing qayerda?"],["Onun arabası yeni.","Uning mashinasi yangi."],["Bizim okulumuz büyük.","Bizning maktabimiz katta."],["Sizin eviniz güzel.","Sizning uyingiz chiroyli."],["Onların çocukları var.","Ularning bolalari bor."],["Kardeşim öğrenci.","Ukam o'quvchi."],["Annem evde.","Onam uyda."]]
},
{
id:'a2-2', lvl:'A2', n:2, tr:'Belirtili İsim Tamlaması', uz:'Aniq izafet',
body:`Aniq izafet — <b>aniq, ma'lum</b> ikki otning bog'lanishi. Birinchi ot <b>genitiv</b> (<code>-ın / -in / -un / -ün</code>), ikkinchi ot <b>egalik</b> qo'shimchasini oladi.
<br><br><code>okulun kapısı</code> — maktabning eshigi<br>
<code>evin rengi</code> — uyning rangi<br>
<code>Ali'nin kitabı</code> — Alining kitobi
<br><br>O'zbek tilidagi <b>"maktabning eshigi"</b> qurilishiga to'liq mos keladi. Ikkinchi ot ham, birinchi ot ham qo'shimcha oladi — bu o'zbek tilidagi kabi.
<br><br><b>Diqqat:</b> so'z unli bilan tugasa, 1-otda <b>n</b> qo'shiladi: <code>araba → arabanın</code>, <code>kapı → kapının</code>.`,
ex:[["okulun kapısı","maktabning eshigi"],["evin rengi","uyning rangi"],["Ali'nin kitabı","Alining kitobi"],["arabanın anahtarı","mashinaning kaliti"],["öğrencinin defteri","o'quvchining daftari"],["Türkiye'nin başkenti","Turkiyaning poytaxti"],["annenin yemeği","onaning ovqati"],["şehrin merkezi","shaharning markazi"]]
},
{
id:'a2-3', lvl:'A2', n:3, tr:'Belirtisiz İsim Tamlaması', uz:'Aniqmas izafet',
body:`Aniqmas izafetda birinchi ot <b>hech qanday qo'shimcha olmaydi</b>, ikkinchi ot esa <b>3-shaxs egalik</b> qo'shimchasini oladi.
<br><br><code>okul kapısı</code> — maktab eshigi (qaysi maktab ekani noma'lum)<br>
<code>Türk kahvesi</code> — turk qahvasi<br>
<code>altın yüzük</code> — oltin uzuk
<br><br>Farqi: aniq izafetda <b>aniq bir narsa</b> haqida gapiriladi, aniqmas izafetda esa <b>tur, xil</b> bildiriladi.
<br><br>O'zbek tilida bu qurilish <b>izofat</b> deb ataladi: "maktab eshigi", "turk qahvasi", "oltin uzuk".`,
ex:[["okul kapısı","maktab eshigi"],["Türk kahvesi","turk qahvasi"],["altın yüzük","oltin uzuk"],["tahta masa","yog'och stol"],["çay bardağı","choy piyolasi"],["kadın doktor","ayol shifokor"],["İngilizce kitabı","ingliz tili kitobi"],["çocuk oyunu","bolalar o'yini"]]
},
{
id:'a2-4', lvl:'A2', n:4, tr:'Zincirleme İsim Tamlaması', uz:'Zanjirsimon izafet',
body:`Zanjirsimon izafet — <b>uchtadan ortiq</b> otning ketma-ket bog'lanishi. Har bir oraliq ot ikki tomonlama qo'shimcha oladi.
<br><br><code>okulun bahçe kapısı</code> — maktabning hovli eshigi<br>
<code>Ali'nin kardeşinin arabası</code> — Alining ukasining mashinasi<br>
<code>Türkiye'nin en büyük şehrinin adı</code> — Turkiyaning eng katta shahrining nomi
<br><br>O'zbek tilida ham xuddi shunday zanjir hosil bo'ladi: "maktabning hovli eshigi". Bu qurilishda oxirgi ot har doim egalik qo'shimchasini oladi.`,
ex:[["okulun bahçe kapısı","maktabning hovli eshigi"],["Ali'nin kardeşinin arabası","Alining ukasining mashinasi"],["evin çatı katı","uyning chordoq qavati"],["şirketin satış müdürü","kompaniyaning savdo direktori"],["üniversitenin yabancı dil bölümü","universitetning chet tillari bo'limi"],["annenin el işi","onaning qo'l ishi"],["bankanın kredi faizi","bankning kredit foizi"],["ülkenin ekonomik durumu","mamlakatning iqtisodiy ahvoli"]]
},
{
id:'a2-5', lvl:'A2', n:5, tr:'Belirli Geçmiş Zaman (-dı / -di / -du / -dü)', uz:"Aniq o'tgan zamon",
body:`Bu zamon <b>ko'rilgan, aniq, guvoh bo'lingan</b> o'tmishni bildiradi. Qo'shimchasi: <code>-dı / -di / -du / -dü</code>, jarangsiz undoshdan keyin <code>-tı / -ti / -tu / -tü</code>.
<br><br><b>Shaxs qo'shimchalari:</b><br>
<code>-m</code> (men) → <code>geldim</code><br>
<code>-n</code> (sen) → <code>geldin</code><br>
<code>—</code> (u) → <code>geldi</code><br>
<code>-k</code> (biz) → <code>geldik</code><br>
<code>-niz</code> (siz) → <code>geldiniz</code><br>
<code>-lar</code> (ular) → <code>geldiler</code>
<br><br>O'zbek tilidagi <code>-di</code> qo'shimchasiga to'liq mos keladi: "keldim, kelding, keldi, keldik, keldingiz, keldilar".`,
ex:[["Dün okula geldim.","Kecha maktabga keldim."],["Sen ne yaptın?","Sen nima qilding?"],["Ali kitap okudu.","Ali kitob o'qidi."],["Biz sinemaya gittik.","Biz kinoga bordik."],["Siz nerede kaldınız?","Siz qayerda qoldingiz?"],["Onlar erken geldiler.","Ular erta keldilar."],["Sabah kahvaltı yaptım.","Ertalab nonushta qildim."],["Ben onu gördüm.","Men uni ko'rdim."]]
},
{
id:'a2-6', lvl:'A2', n:6, tr:'Belirli Geçmiş Zamanın Olumsuz ve Soru Şekli', uz:"Aniq o'tgan zamonning inkor va so'roq shakli",
body:`<b>Inkor:</b> o'zak + <code>-ma / -me</code> + <code>-dı / -di</code> + shaxs qo'shimchasi.<br>
<code>gelmedim</code> (kelmadim), <code>gelmedin</code>, <code>gelmedi</code>, <code>gelmedik</code>, <code>gelmediniz</code>, <code>gelmediler</code>.
<br><br><b>So'roq:</b> so'roq qo'shimchasi shaxs qo'shimchasidan oldin keladi.<br>
<code>geldim mi?</code> (keldimmi?) • <code>geldin mi?</code> • <code>geldi mi?</code> • <code>geldik mi?</code> • <code>geldiniz mi?</code> • <code>geldiler mi?</code>
<br><br>O'zbek tilida so'roq qo'shimchasi oxirida keladi, turkchada esa <b>shaxs qo'shimchasidan oldin</b> — bu muhim farq!`,
ex:[["Gelmedim.","Kelmadim."],["Anlamadı.","Tushunmadi."],["Yapmadık.","Qilmadik."],["Geldin mi?","Keldingmi?"],["Gördün mü?","Ko'rdingmi?"],["Yedi mi?","Yedimi?"],["Okula gittiniz mi?","Maktabga bordingizmi?"],["Dün çalıştılar mı?","Kecha ishladilarmi?"]]
},
{
id:'a2-7', lvl:'A2', n:7, tr:'Ek-Fiil: İsim Cümlelerinde Geçmiş Zaman', uz:"Ot gaplarda o'tgan zamon",
body:`Ot gaplarni o'tgan zamonga aylantirish uchun <code>-(y)dı / -(y)di</code> qo'shimchasi otga qo'shiladi.
<br><br><code>öğrenci → öğrenciydim</code> (o'quvchi edim)<br>
<code>öğrenci → öğrenciydin</code><br>
<code>öğrenci → öğrenciydi</code><br>
<code>öğrenci → öğrenciydik</code><br>
<code>öğrenci → öğrenciydiniz</code><br>
<code>öğrenci → öğrenciydiler</code>
<br><br><b>Inkor:</b> <code>değildim</code>, <code>değildin</code>, <code>değildi</code>...<br>
<code>Ben hasta değildim</code> — Men kasal emasdim.
<br><br>O'zbek tilidagi "edim, eding, edi" yordamchi fe'liga mos keladi.`,
ex:[["Ben öğrenciydim.","Men o'quvchi edim."],["Sen gençtin.","Sen yosh eding."],["O doktordu.","U shifokor edi."],["Biz mutluyduk.","Biz baxtli edik."],["Siz haklıydınız.","Siz haq edingiz."],["Hava çok sıcaktı.","Havo juda issiq edi."],["Ben yorgun değildim.","Men charchagan emasdim."],["O zaman çocuktuk.","O'shanda bola edik."]]
},
{
id:'a2-8', lvl:'A2', n:8, tr:'Gelecek Zaman (-acak / -ecek)', uz:'Kelasi zamon',
body:`Kelasi zamon <b>kelajakda bo'ladigan</b> harakatni bildiradi. Qo'shimchasi: <code>-acak / -ecek</code>.
<br><br><b>Shaxs qo'shimchalari:</b><br>
<code>-ım</code> (men) → <code>geleceğim</code><br>
<code>-sın</code> (sen) → <code>geleceksin</code><br>
<code>—</code> (u) → <code>gelecek</code><br>
<code>-ız</code> (biz) → <code>geleceğiz</code><br>
<code>-sınız</code> (siz) → <code>geleceksiniz</code><br>
<code>-lar</code> (ular) → <code>gelecekler</code>
<br><br><b>Inkor:</b> <code>gelmeyeceğim</code>, <code>gelmeyeceksin</code>...<br>
<b>So'roq:</b> <code>gelecek miyim?</code>, <code>gelecek misin?</code>
<br><br>O'zbek tilidagi "-aman / -asan" kelasi zamon shakllariga mos keladi.`,
ex:[["Yarın geleceğim.","Ertaga kelaman."],["Ne yapacaksın?","Nima qilasan?"],["O kitap okuyacak.","U kitob o'qiydi."],["Birlikte gideceğiz.","Birga boramiz."],["Siz ne zaman geleceksiniz?","Siz qachon kelasiz?"],["Onlar çalışacaklar.","Ular ishlaydilar."],["Yarın yağmur yağacak.","Ertaga yomg'ir yog'adi."],["Sana yardım edeceğim.","Senga yordam beraman."]]
},
{
id:'a2-9', lvl:'A2', n:9, tr:'Gelecek Zamanda Yumuşama (k → ğ)', uz:"Kelasi zamonda yumshash (k → ğ)",
body:`<code>-acak / -ecek</code> qo'shimchasidan keyin <b>unli bilan boshlanuvchi</b> shaxs qo'shimchasi kelsa, <code>k</code> harfi <b>ğ</b> ga aylanadi.
<br><br><code>gelecek + im → geleceğim</code><br>
<code>yapacak + ım → yapacağım</code><br>
<code>gidecek + iz → gideceğiz</code><br>
<code>okuyacak + ız → okuyacağız</code>
<br><br>Ammo shaxs qo'shimchasi undosh bilan boshlansa (<code>-sın, -sınız, -lar</code>), <b>yumshash bo'lmaydi</b>:<br>
<code>geleceksin</code>, <code>geleceksiniz</code>, <code>gelecekler</code>.
<br><br>Bu qoida o'zbek tilida yo'q, shuning uchun yozuvda ko'p xato qilinadi. Diqqat bilan yodlang!`,
ex:[["geleceğim","kelaman"],["geleceksin","kelasan"],["gelecek","keladi"],["geleceğiz","kelamiz"],["geleceksiniz","kelasiz"],["gelecekler","keladilar"],["yapacağım","qilaman"],["gideceğiz","boramiz"]]
},
{
id:'a2-10', lvl:'A2', n:10, tr:'Lazım / Gerek / İhtiyacı Olmak', uz:"Kerak / Zarur / Ehtiyoji bor",
body:`Turk tilida "<b>kerak</b>" ma'nosi uchta usulda ifodalanadi:
<br><br><b>1) lazım / gerek</b> — harakat nomi (<code>-mak / -mek</code>) yoki fe'l o'zagi bilan:<br>
<code>Gitmem lazım.</code> — Ketishim kerak.<br>
<code>Çalışmak gerek.</code> — Ishlash kerak.
<br><br><b>2) gerekiyor</b> — hozirgi zamonda:<br>
<code>Beklememiz gerekiyor.</code> — Kutishimiz kerak.
<br><br><b>3) ihtiyacı olmak</b> — "<b>ehtiyoji bor</b>" ma'nosida, <code>-a / -e</code> kelishigi bilan:<br>
<code>Suya ihtiyacım var.</code> — Suvga ehtiyojim bor.<br>
<code>Yardıma ihtiyacın var mı?</code> — Yordamga ehtiyojing bormi?
<br><br>O'zbek tilidagi "kerak" so'ziga to'liq mos keladi.`,
ex:[["Gitmem lazım.","Ketishim kerak."],["Dinlenmen gerek.","Dam olishing kerak."],["Param lazım.","Pulim kerak."],["Yardıma ihtiyacım var.","Yordamga ehtiyojim bor."],["Doktora gitmem gerekiyor.","Shifokorga borishim kerak."],["Sana ihtiyacım var.","Senga ehtiyojim bor."],["Daha çok çalışmamız lazım.","Ko'proq ishlashimiz kerak."],["Uyumam gerek.","Uxlashim kerak."]]
},
{
id:'a2-11', lvl:'A2', n:11, tr:"«İstemek» Fiili ve İnfinitiv Yapıları", uz:'"Xohlamoq" fe\'li va infinitiv',
body:`<b>istemek</b> fe'li "xohlamoq" ma'nosini beradi va o'zidan oldin <b>harakat nomi</b> (<code>-mak / -mek</code>) talab qiladi.
<br><br><code>gitmek istiyorum</code> — ketishni xohlayapman<br>
<code>yemek istiyor musun?</code> — ovqat yeyishni xohlaysanmi?<br>
<code>öğrenmek istiyoruz</code> — o'rganishni xohlayapmiz
<br><br><b>Inkor shakli:</b> <code>gitmek istemiyorum</code> — ketishni xohlamayapman.
<br><br><b>Muhim:</b> turk tilida "xohlayman" deyish uchun <code>istiyorum</code> ishlatiladi, bu fe'l shaxs qo'shimchasini oladi, lekin asosiy fe'l (<code>gitmek</code>) o'zgarmaydi.
<br><br>O'zbek tilidagi "-ishni xohlayman" qurilishiga to'liq mos keladi.`,
ex:[["Türkçe öğrenmek istiyorum.","Turkcha o'rganishni xohlayapman."],["Ne yemek istiyorsun?","Nima yeyishni xohlaysan?"],["Evde kalmak istiyor.","Uyda qolishni xohlaydi."],["Sizinle konuşmak istiyoruz.","Siz bilan gaplashishni xohlayapmiz."],["Gitmek istemiyorum.","Ketishni xohlamayapman."],["Bir şey sormak istiyorum.","Bir narsa so'rashni xohlayapman."],["Dinlenmek istiyor musun?","Dam olishni xohlaysanmi?"],["Çalışmak istemiyorlar.","Ishlashni xohlamayaptilar."]]
},
{
id:'a2-12', lvl:'A2', n:12, tr:'Gibi ve Kadar Edatları', uz:"«Gibi» va «Kadar» ko'makchilari",
body:`<b>gibi</b> — "kabi, singari". O'xshashlikni bildiradi.<br>
<code>Senin gibi çalışkanım.</code> — Sening kabi mehnatkashman.<br>
<code>Buz gibi soğuk.</code> — Muz kabi sovuq.
<br><br><b>kadar</b> — "kadar, qadar". Miqdor, chegara yoki taqqoslashni bildiradi.<br>
<code>Senin kadar akıllısın.</code> — Sening qadaring aqllisan.<br>
<code>Akşama kadar çalıştım.</code> — Kechgacha ishladim.<br>
<code>Üç saat kadar bekledim.</code> — Uch soatcha kutdim.
<br><br>O'zbek tilida <b>gibi</b> = "kabi", <b>kadar</b> = "kadar/qadar". Ikkisi ham o'zbek tilida mavjud va ma'nolari bir xil.`,
ex:[["Senin gibi düşünüyorum.","Sening kabi o'ylayapman."],["Altın gibi parlıyor.","Oltin kabi yaltirayapti."],["Ben senin kadar hızlıyım.","Men sening qadaring tezman."],["Akşama kadar bekledim.","Kechgacha kutdim."],["Bir saat kadar sürdü.","Bir soatcha davom etdi."],["Çocuk gibi davranıyor.","Bola kabi tutyapti."],["Bu kadar yeter.","Shuncha yetadi."],["O kadar güzel değil.","Uncha chiroyli emas."]]
},
{
id:'a2-13', lvl:'A2', n:13, tr:'İle / -le / -la Edatı', uz:"«İle» ko'makchisi (-le / -la)",
body:`<b>ile</b> ko'makchisi "bilan" ma'nosini beradi va <b>ikki shaklda</b> ishlatiladi:
<br><br><b>1) Alohida so'z sifatida:</b> <code>arkadaş ile</code> — do'st bilan<br>
<b>2) Qo'shimcha sifatida:</b> <code>arkadaşla</code> — do'st bilan
<br><br>Qo'shimcha shakli garmoniyaga bo'ysunadi: <code>-le / -la</code>. So'z unli bilan tugasa → <code>-yle / -yla</code>: <code>araba → arabayla</code>.
<br><br><b>Ishlatilishi:</b> vosita (transport, qurol), birgalik, sabab.<br>
<code>Otobüsle gidiyorum.</code> — Avtobusda ketyapman.<br>
<code>Kalemle yazdım.</code> — Qalam bilan yozdim.<br>
<code>Ali'yle konuştum.</code> — Ali bilan gaplashdim.
<br><br>O'zbek tilidagi "-bilan" qo'shimchasiga to'liq mos keladi.`,
ex:[["Arkadaşımla sinemaya gittim.","Do'stim bilan kinoga bordim."],["Otobüsle geliyorum.","Avtobusda kelyapman."],["Kalemle yaz.","Qalam bilan yoz."],["Ali'yle tanıştım.","Ali bilan tanishdim."],["Araba ile gidiyoruz.","Mashina bilan ketyapmiz."],["Trenle yolculuk yaptık.","Poyezd bilan sayohat qildik."],["Seninle konuşmak istiyorum.","Sen bilan gaplashishni xohlayapman."],["Bıçakla kestim.","Pichoq bilan kesdim."]]
},
{
id:'a2-14', lvl:'A2', n:14, tr:'Edatlar: -dan önce / -dan sonra', uz:"«-dan önce» / «-dan sonra»",
body:`Bu qurilishlar vaqt tartibini bildiradi.
<br><br><b>-dan önce</b> — "-dan oldin":<br>
<code>Dersten önce kahve içerim.</code> — Darsdan oldin qahva ichaman.<br>
<code>Yemekten önce ellerini yıka.</code> — Ovqatdan oldin qo'llaringni yuv.
<br><br><b>-dan sonra</b> — "-dan keyin":<br>
<code>İşten sonra eve gidiyorum.</code> — Ishdan keyin uyga ketyapman.<br>
<code>Yemekten sonra çay içelim.</code> — Ovqatdan keyin choy ichaylik.
<br><br>O'zbek tilidagi "-dan oldin" va "-dan keyin" bilan <b>bir xil</b>. Eslatma: bu qurilishda ot <b>chiqish kelishigi</b>da (<code>-dan</code>) bo'ladi.`,
ex:[["Dersten önce","Darsdan oldin"],["Yemekten sonra","Ovqatdan keyin"],["İşten sonra","Ishdan keyin"],["Toplantıdan önce","Yig'ilishdan oldin"],["Sınavdan sonra","Imtihondan keyin"],["Kahvaltıdan önce spor yaparım.","Nonushtadan oldin sport qilaman."],["Akşam yemeğinden sonra yürüyüşe çıktık.","Kechki ovqatdan keyin sayrga chiqdik."],["Ders çalıştıktan sonra dinlendim.","Dars o'qigandan keyin dam oldim."]]
},
{
id:'a2-15', lvl:'A2', n:15, tr:'Edatlar: -a kadar / -dan beri', uz:"«-a kadar» / «-dan beri»",
body:`<b>-a kadar</b> — "-gacha" (chegara):<br>
<code>Akşama kadar çalıştım.</code> — Kechgacha ishladim.<br>
<code>İstanbul'a kadar gittik.</code> — Istanbulgacha bordik.
<br><br><b>-dan beri</b> — "-dan beri" (boshlanish nuqtasi):<br>
<code>Sabahtan beri bekliyorum.</code> — Ertalabdan beri kutyapman.<br>
<code>İki yıldan beri Türkçe öğreniyorum.</code> — Ikki yildan beri turkcha o'rganyapman.
<br><br>O'zbek tilidagi "-gacha" va "-dan beri" qo'shimchalariga to'liq mos keladi. Ikkisi ham <b>kelishik qo'shimchasi</b> bilan ishlatiladi: <code>-a/-e</code> va <code>-dan/-den</code>.`,
ex:[["Sabahtan beri çalışıyorum.","Ertalabdan beri ishlayapman."],["Akşama kadar bekleyeceğim.","Kechgacha kutaman."],["Eve kadar yürüdük.","Uygacha yurdik."],["Üç günden beri hastayım.","Uch kundan beri kasalman."],["Sınıfa kadar koştu.","Sinfgacha yugurdi."],["Çocukluğumdan beri buradayım.","Bolaligimdan beri bu yerdaman."],["Saat beşe kadar çalışıyoruz.","Soat beshgacha ishlayapmiz."],["Dünden beri onu arıyorum.","Kechadan beri uni qidirayapman."]]
},
{
id:'a2-16', lvl:'A2', n:16, tr:'Miktar ve Derece Zarfları', uz:"Miqdor va daraja ravishlari",
body:`<b>çok</b> — juda, ko'p<br>
<code>Çok güzel.</code> — Juda chiroyli.
<br><br><b>daha</b> — yana, ko'proq (taqqoslash)<br>
<code>Daha büyük.</code> — Undan kattaroq.
<br><br><b>en</b> — eng<br>
<code>En güzel.</code> — Eng chiroyli.
<br><br><b>biraz</b> — biroz, ozgina<br>
<code>Biraz bekle.</code> — Biroz kut.
<br><br><b>az</b> — oz<br>
<code>Az kaldı.</code> — Oz qoldi.
<br><br><b>pek</b> — unchalik (ko'pincha inkor bilan)<br>
<code>Pek iyi değil.</code> — Unchalik yaxshi emas.
<br><br><b>fazla</b> — ortiq<br>
<code>Fazla konuşma.</code> — Ortiq gapirma.
<br><br>O'zbek tilidagi "juda, yana, eng, biroz, oz" so'zlariga mos keladi. <b>daha</b> + sifat = qiyosiy daraja, <b>en</b> + sifat = orttirma daraja.`,
ex:[["Çok güzel.","Juda chiroyli."],["Daha büyük bir ev istiyorum.","Undan kattaroq uy xohlayapman."],["En güzel şehir.","Eng chiroyli shahar."],["Biraz daha bekle.","Biroz ko'proq kut."],["Az param kaldı.","Oz pulim qoldi."],["Pek memnun değilim.","Unchalik mamnun emasman."],["Fazla yemek yeme.","Ortiq ovqat yema."],["Bu çok daha iyi.","Bu juda yaxshiroq."]]
},
{
id:'a2-17', lvl:'A2', n:17, tr:'Yön Zarfları', uz:"Yo'nalish ravishlari",
body:`<b>içeri</b> — ichkariga<br><code>İçeri gel.</code> — Ichkariga kir.
<br><br><b>dışarı</b> — tashqariga<br><code>Dışarı çıktı.</code> — Tashqariga chiqdi.
<br><br><b>aşağı</b> — pastga<br><code>Aşağı in.</code> — Pastga tush.
<br><br><b>yukarı</b> — yuqoriga<br><code>Yukarı çık.</code> — Yuqoriga chiq.
<br><br><b>ileri</b> — oldinga<br><code>İleri git.</code> — Oldinga bor.
<br><br><b>geri</b> — orqaga<br><code>Geri dön.</code> — Orqaga qayt.
<br><br><b>sağa / sola</b> — o'ngga / chapga<br>
<b>dümdüz</b> — to'g'riga
<br><br>O'zbek tilidagi "ichkariga, tashqariga, pastga, yuqoriga" so'zlariga mos keladi. Bu so'zlar ko'pincha fe'l bilan birga keladi.`,
ex:[["İçeri gel!","Ichkariga kir!"],["Dışarı çıkıyoruz.","Tashqariga chiquapmiz."],["Aşağı bak.","Pastga qara."],["Yukarı çıktık.","Yuqoriga chiqdik."],["İleri gidin.","Oldinga boring."],["Geri dön!","Orqaga qayt!"],["Sağa dön.","O'ngga buril."],["Dümdüz gidin.","To'g'riga boring."]]
},
{
id:'a2-18', lvl:'A2', n:18, tr:'Vasıta Hali (-ca / -ce)', uz:"Vosita kelishigi (-cha / -chа)",
body:`<code>-ca / -ce</code> qo'shimchasi <b>"-cha / -chа"</b> ma'nosini beradi va quyidagi hollarda ishlatiladi:
<br><br><b>1) Til nomlari:</b> <code>Türkçe</code> (turkcha), <code>Özbekçe</code> (o'zbekcha), <code>İngilizce</code> (inglizcha).
<br><br><b>2) Fikr bildirish:</b> <code>bence</code> (menimcha), <code>sence</code> (seningcha), <code>onca</code> (uningcha), <code>bizce</code> (bizningcha).
<br><br><b>3) Uslub, tarz:</b> <code>kardeşçe</code> (birodarlarcha), <code>insanca</code> (insonlarcha), <code>gizlice</code> (yashirincha).
<br><br><b>4) Miqdor, taxmin:</b> <code>yüzce</code> (yuzlab), <code>saatçe</code> (soatcha).
<br><br>O'zbek tilidagi <code>-cha</code> qo'shimchasiga to'liq mos keladi. Eslatma: til nomlari har doim katta harf bilan yoziladi.`,
ex:[["Türkçe konuşuyorum.","Turkcha gaplashayapman."],["Özbekçe biliyor musun?","O'zbekcha bilasanmi?"],["Bence haklısın.","Menimcha haqsan."],["Sence ne yapmalıyım?","Seningcha nima qilishim kerak?"],["Onca bu doğru.","Uningcha bu to'g'ri."],["İngilizce öğreniyorum.","Inglizcha o'rganyapman."],["Kardeşçe paylaştık.","Birodarlarcha bo'lishdik."],["Biraz yavaşça konuş.","Biroz sekinchа gapir."]]
},

/* ==================== B1 ==================== */
{
id:'b1-1', lvl:'B1', n:1, tr:'Duyulan Geçmiş Zaman (-mış / -miş)', uz:"Eshitilgan o'tgan zamon (-mish)",
body:`Bu zamon <b>guvoh bo'lmagan</b>, boshqalardan eshitilgan yoki keyin bilib qolingan o'tmishni bildiradi.
<br><br><b>Shakli:</b> o'zak + <code>-mış / -miş / -muş / -müş</code> + shaxs qo'shimchasi.
<br><br><code>gelmişim</code> — kelgan ekanman<br>
<code>gelmişsin</code> — kelgan ekansan<br>
<code>gelmiş</code> — kelgan ekan<br>
<code>gelmişiz</code> — kelgan ekanmiz<br>
<code>gelmişsiniz</code> — kelgan ekansiz<br>
<code>gelmişler</code> — kelgan ekanlar
<br><br><b>Inkor:</b> <code>gelmemişim</code>, <code>gelmemişsin</code>...
<br><br><b>So'roq:</b> <code>gelmiş miyim?</code>, <code>gelmiş misin?</code>
<br><br>O'zbek tilidagi <b>"-gan ekan"</b> qurilishiga to'liq mos keladi. Bu zamon ma'lumotni boshqadan eshitganimizni bildiradi.`,
ex:[["Ali dün okula gelmiş.","Ali kecha maktabga kelgan ekan."],["Sınavı kazanmışsın, tebrikler!","Imtihondan o'tgan ekansan, tabriklaymiz!"],["Haberleri duymuş musun?","Xabarlarni eshitganmisan?"],["O çok çalışmış.","U juda ko'p ishlagan ekan."],["Onlar taşınmışlar.","Ular ko'chib ketgan ekanlar."],["Ben bunu bilmiyormuşum.","Men buni bilmayotgan ekanman."],["Kaza olmuş, kimse yaralanmamış.","Avariya bo'lgan ekan, hech kim yaralanmagan ekan."],["Sen hasta mıymışsın?","Sen kasal ekansanmi?"]]
},
{
id:'b1-2', lvl:'B1', n:2, tr:'Duyulan Geçmiş Zaman Masal ve Rivayetlerde', uz:"Eshitilgan o'tgan zamon ertak va rivoyatlarda",
body:`Turk ertaklari <b>har doim</b> <code>-mış</code> zamoni bilan boshlanadi. Bu an'anaviy uslub.
<br><br><b>Klassik boshlanish:</b><br>
<code>Bir varmış, bir yokmuş...</code> — Bor ekan, yo'q ekan...<br>
<code>Evvel zaman içinde...</code> — Qadim zamonda...<br>
<code>Bir padişah varmış...</code> — Bir podshoh bor ekan...
<br><br><b>Tugash:</b><br>
<code>Onlar ermiş muradına, biz çıkalım kerevetine.</code> — Ular murodiga yetibdi, biz supaning ustiga chiqaylik. (An'anaviy ertak tugatish formulasi)
<br><br>O'zbek ertaklaridagi "bor ekan, yo'q ekan" bilan <b>deyarli bir xil</b>. Bu zamon hikoya qilishda, rivoyatlarda, afsonalarda juda ko'p ishlatiladi.`,
ex:[["Bir varmış, bir yokmuş.","Bor ekan, yo'q ekan."],["Evvel zaman içinde bir kral varmış.","Qadim zamonda bir podshoh bor ekan."],["Kralın üç oğlu varmış.","Podshohning uch o'g'li bor ekan."],["En küçük oğlu çok akıllıymış.","Eng kichik o'g'li juda aqlli ekan."],["Bir gün ormana gitmişler.","Bir kuni o'rmonga boribdilar."],["Orada yaşlı bir kadın görmüşler.","U yerda qari bir ayolni ko'ribdilar."],["Kadın onlara yardım etmiş.","Ayol ularga yordam beribdi."],["Sonunda mutlu olmuşlar.","Oxirida baxtli bo'libdilar."]]
},
{
id:'b1-3', lvl:'B1', n:3, tr:'Ek-Fiil: İsim Cümlelerinde Duyulan Geçmiş Zaman', uz:"Ot gaplarda eshitilgan o'tgan zamon",
body:`Ot gaplarni <code>-mış</code> zamonga aylantirish uchun <code>-(y)mış</code> qo'shimchasi otga qo'shiladi.
<br><br><code>öğrenci → öğrenciymişim</code> — o'quvchi ekanman<br>
<code>öğrenci → öğrenciymişsin</code><br>
<code>öğrenci → öğrenciymiş</code><br>
<code>öğrenci → öğrenciymişiz</code><br>
<code>öğrenci → öğrenciymişsiniz</code><br>
<code>öğrenci → öğrenciymişler</code>
<br><br><b>Inkor:</b> <code>değilmi</code> so'zi bilan: <code>Ben hasta değilmişim</code> — Men kasal emas ekanman.
<br><br>O'zbek tilidagi "o'quvchi ekanman", "kasal emas ekanman" qurilishlariga to'liq mos keladi.`,
ex:[["O eskiden çok zenginmiş.","U ilgari juda boy ekan."],["Sen çok çalışkanmışsın.","Sen juda mehnatkash ekansan."],["Biz gençmişiz.","Biz yosh ekanmiz."],["Onlar öğretmenmişler.","Ular o'qituvchi ekanlar."],["Hava çok sıcakmış.","Havo juda issiq ekan."],["Ben hasta değilmişim.","Men kasal emas ekanman."],["O zaman çocukmuşuz.","O'shanda bola ekanmiz."],["Bu kitap çok güzelmiş.","Bu kitob juda chiroyli ekan."]]
},
{
id:'b1-4', lvl:'B1', n:4, tr:'Geniş Zaman (-ar / -er / -ır / -ir / -r)', uz:"Umumiy zamon (hozirgi-oddiy)",
body:`Umumiy zamon <b>doimiy, takrorlanuvchi</b> harakatlarni bildiradi. O'zbek tilidagi "-man / -asan / -adi" shakllariga mos keladi.
<br><br><b>Qo'shimchalar:</b><br>
• Ko'p bo'g'inli so'zlar → <code>-ır / -ir / -ur / -ür</code>: <code>gelir</code>, <code>yapar</code>, <code>okur</code>, <code>görür</code><br>
• Bir bo'g'inli, unli bilan tugagan → <code>-r</code>: <code>der</code>, <code>yer</code>, <code>okur</code>
<br><br><b>Shaxs qo'shimchalari:</b><br>
<code>-ım</code> (men) → <code>gelirim</code><br>
<code>-sın</code> (sen) → <code>gelirsin</code><br>
<code>—</code> (u) → <code>gelir</code><br>
<code>-ız</code> (biz) → <code>geliriz</code><br>
<code>-sınız</code> (siz) → <code>gelirsiniz</code><br>
<code>-lar</code> (ular) → <code>gelirler</code>
<br><br>O'zbek tilidagi oddiy hozirgi zamon bilan bir xil ma'noga ega.`,
ex:[["Her gün okula giderim.","Har kuni maktabga boraman."],["Türkçe öğrenirsin.","Turkcha o'rganasan."],["O her sabah koşar.","U har ertalab yuguradi."],["Biz erken kalkarız.","Biz erta turamiz."],["Siz nerede çalışırsınız?","Siz qayerda ishlaysiz?"],["Onlar sinemaya giderler.","Ular kinoga boradilar."],["Ben kahve içerim.","Men qahva ichaman."],["Her yaz tatile gideriz.","Har yoz ta'tilga boramiz."]]
},
{
id:'b1-5', lvl:'B1', n:5, tr:'Geniş Zamanın Olumsuz Yapısı (-maz / -mez)', uz:"Umumiy zamonning inkor shakli",
body:`Umumiy zamonning inkor shakli <code>-maz / -mez</code> qo'shimchasi bilan yasaladi (1-shaxs birlik va ko'plik bundan mustasno).
<br><br><code>gelmem</code> (men kelmayman)<br>
<code>gelmezsin</code> (sen kelmaysan)<br>
<code>gelmez</code> (u kelmaydi)<br>
<code>gelmeyiz</code> (biz kelmaymiz)<br>
<code>gelmezsiniz</code> (siz kelmaysiz)<br>
<code>gelmezler</code> (ular kelmaydilar)
<br><br><b>Diqqat:</b> 1-shaxs birlik va ko'plikda <code>-ma / -me</code> ishlatiladi: <code>gelmem</code>, <code>gelmeyiz</code>. Boshqa shaxslarda <code>-maz / -mez</code>.
<br><br>O'zbek tilidagi "-mayman, -maysan, -maydi" shakllariga mos keladi.`,
ex:[["Sigara içmem.","Sigaret chekmayman."],["Erken kalkmazsın.","Erta turmaysan."],["O yalan söylemez.","U yolg'on gapirmaydi."],["Geç kalmayız.","Kech qolmaymiz."],["Bilmezsiniz.","Bilmaysiz."],["Onlar çalışmazlar.","Ular ishlamaydilar."],["Et yemem.","Go'sht yemayman."],["Hiç unutmam.","Hech qachon unutmayman."]]
},
{
id:'b1-6', lvl:'B1', n:6, tr:'Geniş Zaman Soru ve Rica Yapıları', uz:"Umumiy zamonda so'roq va iltimos",
body:`Umumiy zamonda so'roq qo'shimchasi shaxs qo'shimchasidan keyin keladi.
<br><br><code>Gelir miyim?</code> — Kelaymi?<br>
<code>Gelir misin?</code> — Kelasanmi?<br>
<code>Gelir mi?</code> — Keladimi?<br>
<code>Gelir miyiz?</code> — Kelamizmi?<br>
<code>Gelir misiniz?</code> — Kelasizmi?<br>
<code>Gelirler mi?</code> — Keladilarmi?
<br><br><b>Xushmuomalalik (iltimos) shakli:</b> bu juda muhim! Turk tilida iltimos <b>geniş zamonning so'roq shakli</b> bilan ifodalanadi:<br>
<code>Bakar mısınız?</code> — Qarab qo'ysangiz?<br>
<code>Yardım eder misiniz?</code> — Yordam berasizmi?<br>
<code>Bir kahve alabilir miyim?</code> — Bir qahva olsam bo'ladimi?
<br><br>Bu o'zbek tilidagi "qarab qo'ying", "yordam bering" kabi xushmuomala iltimoslarga mos keladi.`,
ex:[["Bakar mısınız?","Qarab qo'ysangiz?"],["Yardım eder misiniz?","Yordam berasizmi?"],["Bir şey sorabilir miyim?","Bir narsa so'rasam bo'ladimi?"],["Ne zaman gelirsin?","Qachon kelasan?"],["Bu otobüs nereye gider?","Bu avtobus qayerga boradi?"],["Fiyatı ne kadar?","Narxi qancha?"],["İngilizce konuşur musunuz?","Inglizcha gaplashasizmi?"],["Menüyü görebilir miyim?","Menyuni ko'rsam bo'ladimi?"]]
},
{
id:'b1-7', lvl:'B1', n:7, tr:'Gereklilik Kipi (-malı / -meli)', uz:"Zaruriyat mayli (-meli / -malı)",
body:`Zaruriyat mayli <b>"kerak, zarur, shart"</b> ma'nosini beradi. Qo'shimchasi: <code>-malı / -meli</code>.
<br><br><code>gitmeliyim</code> — ketishim kerak<br>
<code>gitmelisin</code> — ketishing kerak<br>
<code>gitmeli</code> — ketishi kerak<br>
<code>gitmeliyiz</code> — ketishimiz kerak<br>
<code>gitmelisiniz</code> — ketishingiz kerak<br>
<code>gitmeliler</code> — ketishlari kerak
<br><br><b>Inkor:</b> <code>gitmemeliyim</code> — ketmasligim kerak.
<br><br><b>So'roq:</b> <code>Gitmeli miyim?</code> — Ketishim kerakmi?
<br><br>O'zbek tilidagi "-ishim kerak" qurilishiga mos keladi. Farqi: turkchada bu <b>bitta qo'shimcha</b> bilan yasaladi, o'zbekchada esa yordamchi so'z ("kerak") bilan.`,
ex:[["Şimdi gitmeliyim.","Hozir ketishim kerak."],["Daha çok çalışmalısın.","Ko'proq ishlashing kerak."],["O doktora gitmeli.","U shifokorga borishi kerak."],["Erken yatmalıyız.","Erta yotishimiz kerak."],["Sigara içmemelisiniz.","Sigaret chekmasligingiz kerak."],["Bu kitabı okumalıyım.","Bu kitobni o'qishim kerak."],["Ne yapmalıyım?","Nima qilishim kerak?"],["Spor yapmalıyız.","Sport qilishimiz kerak."]]
},
{
id:'b1-8', lvl:'B1', n:8, tr:'Yeterlilik Fiili: -ebilmek / -abilmek', uz:"Imkoniyat fe'li (-a olmoq)",
body:`Bu qurilish <b>"-a olmoq"</b> ma'nosini beradi va qobiliyat, imkoniyatni bildiradi.
<br><br><b>Shakli:</b> o'zak + <code>-a / -e</code> + <code>bil-</code> + zamon/shaxs qo'shimchasi.
<br><br><code>gelebilirim</code> — kela olaman<br>
<code>gelebilirsin</code> — kela olasan<br>
<code>gelebilir</code> — kela oladi<br>
<code>gelebiliriz</code> — kela olamiz<br>
<code>gelebilirsiniz</code> — kela olasiz<br>
<code>gelebilirler</code> — kela oladilar
<br><br><b>Inkor shakli:</b> <code>gelemem</code> (kela olmayman), <code>gelemezsin</code>, <code>gelemez</code>, <code>gelemeyiz</code>, <code>gelemezsiniz</code>, <code>gelemezler</code>.
<br><br><b>So'roq:</b> <code>Gelebilir miyim?</code> — Kela olamanmi?
<br><br>O'zbek tilidagi "-a olaman" qurilishiga to'liq mos keladi.`,
ex:[["Yarın gelebilirim.","Ertaga kela olaman."],["Türkçe konuşabilir misin?","Turkcha gaplasha olasanmi?"],["Bu kitabı okuyabilir.","U bu kitobni o'qiy oladi."],["Yardım edebilir miyiz?","Yordam bera olamizmi?"],["Gelemem, çok meşgulüm.","Kela olmayman, juda bandman."],["Anlayabiliyor musunuz?","Tushuna olasizmi?"],["Ben yüzebilirim.","Men suza olaman."],["O gelemedi.","U kela olmadi."]]
},
{
id:'b1-9', lvl:'B1', n:9, tr:'Emir ve İstek Kipi Birleşimi (B1)', uz:"Buyruq va xohish mayli birikmasi",
body:`B1 darajasida buyruq mayli <b>barcha shaxslar</b> uchun o'rganiladi.
<br><br><b>Men:</b> <code>-ayım / -eyim</code> → <code>gideyim</code> (ketay), <code>yapayım</code> (qilay)<br>
<b>Sen:</b> o'zak → <code>git!</code>, <code>yap!</code><br>
<b>U:</b> <code>-sın / -sin</code> → <code>gitsin</code> (ketsin), <code>yapsın</code> (qilsin)<br>
<b>Biz:</b> <code>-alım / -elim</code> → <code>gidelim</code> (ketaylik), <code>yapalım</code> (qilaylik)<br>
<b>Siz:</b> <code>-ın / -in</code> yoki <code>-yın / -yin</code> → <code>gidin</code>, <code>yapın</code><br>
<b>Ular:</b> <code>-sınlar / -sinler</code> → <code>gitsinler</code> (ketsinlar), <code>yapsınlar</code> (qilsinlar)
<br><br><b>Inkor:</b> <code>-ma / -me</code>: <code>gitme</code>, <code>gitmesin</code>, <code>gitmeyin</code>, <code>gitmesinler</code>.
<br><br>O'zbek tilidagi "-ay, -gin, -sin, -aylik, -inglar, -sinlar" qo'shimchalariga mos keladi.`,
ex:[["Gideyim.","Ketay."],["Sen git!","Sen ket!"],["O gitsin.","U ketsin."],["Biz gidelim.","Biz ketaylik."],["Siz gidin.","Siz keting."],["Onlar gitsinler.","Ular ketsinlar."],["Gelmesin!","Kelmasin!"],["Yapsınlar.","Qilsinlar."]]
},
{
id:'b1-10', lvl:'B1', n:10, tr:'Amaç ve Sebep: -mak için / -mak üzere / -dığı için', uz:"Maqsad va sabab qurilmalari",
body:`<b>-mak için</b> — "-ish uchun" (maqsad):<br>
<code>Türkçe öğrenmek için çalışıyorum.</code> — Turkcha o'rganish uchun ishlayapman.
<br><br><b>-mak üzere</b> — "-ish uchun, -ish maqsadida" (rasmiyroq):<br>
<code>Toplantı yapmak üzere geldik.</code> — Yig'ilish qilish maqsadida keldik.
<br><br><b>-dığı için</b> — "-gani uchun" (sabab):<br>
<code>Hasta olduğu için gelmedi.</code> — Kasal bo'lgani uchun kelmadi.<br>
<code>Yağmur yağdığı için dışarı çıkmadık.</code> — Yomg'ir yog'gani uchun tashqariga chiqmadik.
<br><br>O'zbek tilidagi "-ish uchun" va "-gani uchun" qurilishlariga to'liq mos keladi. Bu B1 darajasining muhim mavzusi.`,
ex:[["Türkçe öğrenmek için çalışıyorum.","Turkcha o'rganish uchun ishlayapman."],["Para kazanmak için çalışıyor.","Pul topish uchun ishlaydi."],["Seni görmek için geldim.","Seni ko'rish uchun keldim."],["Hasta olduğu için gelemedi.","Kasal bo'lgani uchun kela olmadi."],["Yağmur yağdığı için evde kaldık.","Yomg'ir yog'gani uchun uyda qoldik."],["Geç kaldığım için özür dilerim.","Kech qolganim uchun kechirasiz."],["Yardım etmek üzere buradayım.","Yordam berish uchun bu yerdaman."],["Sınavı kazanmak için çok çalıştı.","Imtihondan o'tish uchun juda ko'p ishladi."]]
},
{
id:'b1-11', lvl:'B1', n:11, tr:'Zarf-Fiil: -ip / -up / -üp', uz:"Ravishdosh: -ip / -ib",
body:`<code>-ip / -ıp / -up / -üp</code> qo'shimchasi <b>ketma-ket</b> bo'ladigan harakatlarni bog'laydi.
<br><br><code>gelip</code> — kelib<br>
<code>yapıp</code> — qilib<br>
<code>okuyup</code> — o'qib<br>
<code>görüp</code> — ko'rib
<br><br><b>Misol:</b> <code>Eve gelip yemek yaptı.</code> — Uyga kelib ovqat qildi.
<br><br><b>Muhim:</b> bu qo'shimcha <b>bir xil shaxs</b>ning ketma-ket harakatlarini bog'laydi va zamon qo'shimchasi faqat <b>oxirgi fe'lga</b> qo'shiladi.
<br><br>O'zbek tilidagi <code>-ib</code> qo'shimchasiga to'liq mos keladi: "kelib, qilib, o'qib".`,
ex:[["Eve gelip yemek yaptı.","Uyga kelib ovqat qildi."],["Kitabı okuyup yattı.","Kitobni o'qib yotdi."],["Elini yıkayıp sofraya oturdu.","Qo'lini yuvib dasturxonga o'tirdi."],["Koşup geldi.","Yugurib keldi."],["Gülüp geçti.","Kulib o'tdi."],["Mektubu yazıp gönderdim.","Xatni yozib yubordim."],["Alışveriş yapıp eve döndük.","Xarid qilib uyga qaytdik."],["Onu görüp tanıdım.","Uni ko'rib tanidim."]]
},
{
id:'b1-12', lvl:'B1', n:12, tr:'Zarf-Fiil: -erek / -arak', uz:"Ravishdosh: -erek / -arak",
body:`<code>-erek / -arak</code> qo'shimchasi harakatning <b>qanday</b> bajarilganini bildiradi ("-ib" ma'nosida, lekin uslubni ta'kidlaydi).
<br><br><code>yaparak</code> — qilib (biror usulda)<br>
<code>gelerek</code> — kelib<br>
<code>okuyarak</code> — o'qib<br>
<code>gülerek</code> — kulib
<br><br><b>Misol:</b> <code>Şarkı söyleyerek yürüyordu.</code> — Qo'shiq aytib yurardi.
<br><br><b>Farqi -ip bilan:</b> <code>-ip</code> ketma-ketlikni bildiradi, <code>-erek</code> esa <b>bir vaqtda</b> bajarilayotgan harakatni yoki usulni bildiradi.
<br><br>O'zbek tilidagi "-ib" yoki "-b" qo'shimchasiga mos keladi, ba'zan "holda" so'zi bilan tarjima qilinadi.`,
ex:[["Şarkı söyleyerek yürüyordu.","Qo'shiq aytib yurardi."],["Gülerek cevap verdi.","Kulib javob berdi."],["Koşarak geldi.","Yugurib keldi."],["Bakarak dinliyordu.","Qarab tinglardi."],["Yazarak öğreniyorum.","Yozib o'rganyapman."],["Ağlayarak konuştu.","Yig'lab gapirdi."],["Düşünerek karar verdik.","O'ylab qaror qildik."],["El sallayarak vedalaştık.","Qo'l silkitib xayrlashdik."]]
},
{
id:'b1-13', lvl:'B1', n:13, tr:'Zarf-Fiil: -ken (Evdeyken, Gelirken)', uz:"Ravishdosh: -ken (-ganda, -ayotganda)",
body:`<code>-ken</code> qo'shimchasi <b>"-ganda, -ayotganda, -gan paytda"</b> ma'nosini beradi va asosiy fe'lga emas, <b>yordamchi shakllarga</b> qo'shiladi.
<br><br><b>Ot gaplarda:</b> ot + <code>-(y)ken</code><br>
<code>evdeyken</code> — uyda bo'lganimda<br>
<code>öğrenciyken</code> — o'quvchi bo'lganimda<br>
<code>hastayken</code> — kasal bo'lganimda
<br><br><b>Fe'l gaplarda:</b> geniş zamon o'zagi + <code>-ken</code><br>
<code>gelirken</code> — kelayotganimda<br>
<code>giderken</code> — ketayotganimda<br>
<code>okurken</code> — o'qiyotganimda<br>
<code>yaparken</code> — qilayotganimda
<br><br>O'zbek tilidagi "-ganda, -ayotganda" qo'shimchalariga mos keladi.`,
ex:[["Evdeyken kitap okudum.","Uyda bo'lganimda kitob o'qidim."],["Gelirken ekmek aldım.","Kelayoтganda non oldim."],["Okurken müzik dinliyorum.","O'qiyotganimda musiqa tinglayapman."],["Öğrenciyken çok çalışırdım.","O'quvchi bo'lganimda juda ko'p ishlardim."],["Hastayken işe gitmedi.","Kasal bo'lganida ishga bormadi."],["Yürürken telefonuma baktım.","Yurayotganimda telefonimga qaradim."],["Sen uyurken biz çalıştık.","Sen uxlayotganingda biz ishladik."],["Küçükken burada oynardık.","Kichkina bo'lganimizda bu yerda o'ynardik."]]
},
{
id:'b1-14', lvl:'B1', n:14, tr:'Zarf-Fiil: -madan / -meden / -meksizin', uz:"Ravishdosh: -masdan / -madan",
body:`<code>-madan / -meden</code> qo'shimchasi <b>"-masdan, -may"</b> ma'nosini beradi (harakat bajarilmasdan).
<br><br><code>gelmeden</code> — kelmasdan<br>
<code>yapmadan</code> — qilmasdan<br>
<code>okumadan</code> — o'qimasdan<br>
<code>görmeden</code> — ko'rmasdan
<br><br><b>Misol:</b> <code>Kahvaltı yapmadan işe gitti.</code> — Nonushta qilmasdan ishga ketdi.
<br><br><b>-meksizin</b> — rasmiy uslub, xuddi shu ma'noni beradi: <code>beklemeksizin</code> — kutmasdan.
<br><br>O'zbek tilidagi "-masdan" qo'shimchasiga to'liq mos keladi: "kelmasdan, qilmasdan, o'qimasdan".`,
ex:[["Kahvaltı yapmadan işe gitti.","Nonushta qilmasdan ishga ketdi."],["Bana sormadan karar verdi.","Mendan so'ramasdan qaror qildi."],["Hiç dinlenmeden çalıştı.","Hech dam olmasdan ishladi."],["Ona bakmadan konuştu.","Unga qaramasdan gapirdi."],["Düşünmeden cevap verdi.","O'ylamasdan javob berdi."],["Elini yıkamadan yemek yedi.","Qo'lini yuvmasdan ovqat yedi."],["Vedalaşmadan gitti.","Xayrlashmasdan ketdi."],["Bir şey söylemeden çıktı.","Hech narsa aytmasdan chiqdi."]]
},
{
id:'b1-15', lvl:'B1', n:15, tr:'Zarf-Fiil: -er ... -mez (Gelir gelmez)', uz:"Ravishdosh: -ishi bilanoq",
body:`<code>-er ... -mez</code> qurilishi <b>"-ishi bilanoq, -gandan so'ng darhol"</b> ma'nosini beradi.
<br><br><code>gelir gelmez</code> — kelishi bilanoq<br>
<code>görür görmez</code> — ko'rishi bilanoq<br>
<code>yapar yapmaz</code> — qilishi bilanoq<br>
<code>duyar duymaz</code> — eshitishi bilanoq
<br><br><b>Misol:</b> <code>Onu görür görmez tanıdım.</code> — Uni ko'rishim bilanoq tanidim.
<br><br>Shakli: fe'lning <b>umumiy zamon</b> o'zagi takrorlanadi — birinchisi <code>-er / -ar</code> bilan, ikkinchisi <code>-mez / -maz</code> bilan.
<br><br>O'zbek tilidagi "-ishi bilanoq" qurilishiga to'liq mos keladi.`,
ex:[["Gelir gelmez beni aradı.","Kelishi bilanoq menga qo'ng'iroq qildi."],["Onu görür görmez tanıdım.","Uni ko'rishim bilanoq tanidim."],["Yapar yapmaz haber ver.","Qilishing bilanoq xabar ber."],["Duyar duymaz geldi.","Eshitishi bilanoq keldi."],["Eve girer girmez yattı.","Uyga kirishi bilanoq yotdi."],["Bitirir bitirmez gideceğim.","Tugatishim bilanoq ketaman."],["Okur okumaz anladı.","O'qishi bilanoq tushundi."],["Başlar başlamaz yağmur yağdı.","Boshlanishi bilanoq yomg'ir yog'di."]]
},
{
id:'b1-16', lvl:'B1', n:16, tr:'Edilgen Fiil (-il / -in)', uz:"Majhul nisbat",
body:`Majhul nisbat <b>"-il / -in / -un / -ün"</b> qo'shimchalari bilan yasaladi va harakatni <b>kim bajargani noma'lum</b> bo'lganda ishlatiladi.
<br><br><code>yapmak → yapılmak</code> — qilinmoq<br>
<code>okumak → okunmak</code> — o'qilmoq<br>
<code>açmak → açılmak</code> — ochilmoq<br>
<code>söylemek → söylenmek</code> — aytilmoq<br>
<code>görmek → görülmek</code> — ko'rilmoq
<br><br><b>Misol:</b> <code>Bu kitap çok okunuyor.</code> — Bu kitob juda ko'p o'qilyapti.
<br><br><b>Kim tomonidan?</b> bajaruvchi <code>tarafından</code> yoki <code>-ca</code> bilan beriladi: <code>Bu bina devlet tarafından yapıldı.</code>
<br><br>O'zbek tilidagi <code>-il / -in</code> qo'shimchasiga mos keladi: "yozilmoq, o'qilmoq, ochilmoq".`,
ex:[["Bu kitap çok okunuyor.","Bu kitob juda ko'p o'qilyapti."],["Kapı açıldı.","Eshik ochildi."],["Yemek yapıldı.","Ovqat qilindi."],["Sınav sonuçları açıklandı.","Imtihon natijalari e'lon qilindi."],["Bu ev 1990'da yapıldı.","Bu uy 1990-yilda qurildi."],["Türkçe çok konuşuluyor.","Turkcha juda ko'p gapirilyapti."],["Mektup gönderildi.","Xat yuborildi."],["Toplantı iptal edildi.","Yig'ilish bekor qilindi."]]
},
{
id:'b1-17', lvl:'B1', n:17, tr:'Ettirgen Fiil (-dır / -t / -ır)', uz:"Ortirma nisbat",
body:`Ortirma nisbat <b>"-dır / -dir / -t / -ır / -ir"</b> qo'shimchalari bilan yasaladi va harakatni <b>boshqa birovga bajartirish</b> ma'nosini beradi.
<br><br><code>yapmak → yaptırmak</code> — qildirmoq<br>
<code>okumak → okutmak</code> — o'qitmoq<br>
<code>içmek → içirmek</code> — ichirmoq<br>
<code>gülmek → güldürmek</code> — kuldirmoq<br>
<code>yazmak → yazdırmak</code> — yozdirmoq
<br><br><b>Misol:</b> <code>Evimi boyattım.</code> — Uyimni bo'yattirdim.
<br><br>O'zbek tilidagi <code>-dir / -t / -ir</code> qo'shimchalariga to'liq mos keladi: "qildirmoq, yozdirmoq, o'qitmoq".`,
ex:[["Evimi boyattım.","Uyimni bo'yattirdim."],["Saçımı kestirdim.","Sochimni oldirdim."],["Çocuğa kitap okuttu.","Bolaga kitob o'qitdi."],["Bana su içirdi.","Menga suv ichirdi."],["Herkesi güldürdü.","Hammani kuldirib qo'ydi."],["Mektubu yazdırdım.","Xatni yozdirdim."],["Arabayı tamir ettirdik.","Mashinani ta'mirlattirdik."],["Ona yemek yaptırdı.","Unga ovqat qildirdi."]]
},
{
id:'b1-18', lvl:'B1', n:18, tr:'Dönüşlü Fiil (-in / -il)', uz:"O'zlik nisbati",
body:`O'zlik nisbati <b>"-in / -il / -un / -ün"</b> qo'shimchalari bilan yasaladi va harakat <b>egasining o'ziga qaratilgan</b> bo'ladi.
<br><br><code>yıkamak → yıkanmak</code> — yuvinmoq<br>
<code>giymek → giyinmek</code> — ki yinmoq<br>
<code>sevmek → sevinmek</code> — sevinmoq<br>
<code>hazırlamak → hazırlanmak</code> — tayyorlanmoq<br>
<code>korkmak → korkunmak</code> — qo'rqinmoq (kam ishlatiladi)
<br><br><b>Misol:</b> <code>Her sabah yıkanıyorum.</code> — Har ertalab yuvinaman.
<br><br>O'zbek tilidagi <code>-in</code> qo'shimchasiga mos keladi: "yuvinmoq, kiyinmoq, sevinmoq, tayyorlanmoq".`,
ex:[["Her sabah yıkanıyorum.","Har ertalab yuvinaman."],["Çabuk giyindi.","Tez ki yindi."],["Sınavı kazanınca sevindi.","Imtihondan o'tgach sevindi."],["Yolculuğa hazırlanıyoruz.","Sayohatga tayyorlanayapmiz."],["Aynada kendini gördü.","Oynada o'zini ko'rdi."],["Çocuk korkundu.","Bola qo'rqindi."],["Saçını tarandı.","Sochini tarandi."],["Sıkı giyin, hava soğuk.","Issiq kiyin, havo sovuq."]]
},
{
id:'b1-19', lvl:'B1', n:19, tr:'İşteş Fiil (-ış / -iş)', uz:"Birgalik nisbati",
body:`Birgalik nisbati <b>"-ış / -iş / -uş / -üş"</b> qo'shimchalari bilan yasaladi va harakatning <b>birgalikda yoki o'zaro</b> bajarilishini bildiradi.
<br><br><code>görmek → görüşmek</code> — ko'rishmoq<br>
<code>konuşmak → konuşmak</code> (o'zi birgalik)<br>
<code>selamlamak → selamlaşmak</code> — salomlashmoq<br>
<code>bakmak → bakışmak</code> — bir-biriga qarashmoq<br>
<code>dövmek → dövüşmek</code> — urishmoq
<br><br><b>Misol:</b> <code>Yarın görüşürüz.</code> — Ertaga ko'rishamiz.
<br><br>O'zbek tilidagi <code>-ish</code> qo'shimchasiga mos keladi: "ko'rishmoq, salomlashmoq, urishmoq".`,
ex:[["Yarın görüşürüz.","Ertaga ko'rishamiz."],["Onlar selamlaştılar.","Ular salomlashdilar."],["İki arkadaş bakıştı.","Ikki do'st bir-biriga qarashdi."],["Herkes tokalaştı.","Hamma qo'l berishib ko'rishdi."],["Komşular yardımlaştı.","Qo'shnilar yordamlashdilar."],["Çocuklar dövüştü.","Bolalar urishdilar."],["Mektuplaştık.","Xat yozishib turdik."],["Sabahtan beri konuşuyoruz.","Ertalabdan beri gaplashayapmiz."]]
},

/* ==================== B2 ==================== */
{
id:'b2-1', lvl:'B2', n:1, tr:'Koşul Kipi (-sa / -se)', uz:"Shart mayli (-sa / -se)",
body:`Shart mayli <b>"agar ...sa"</b> ma'nosini beradi. Qo'shimchasi: <code>-sa / -se</code>.
<br><br><b>Hozirgi/kelasi shart:</b><br>
<code>gelsem</code> — kelsam<br>
<code>gelsen</code> — kelsang<br>
<code>gelse</code> — kelsa<br>
<code>gelsek</code> — kelsak<br>
<code>gelseniz</code> — kelsangiz<br>
<code>gelseler</code> — kelsalar
<br><br><b>O'tgan zamondagi shart:</b> <code>-saydı / -seydi</code> qo'shimchasi bilan:<br>
<code>gelseydim</code> — kelganimda (o'tmishda)<br>
<code>Vaktim olsaydı, gelirdim.</code> — Vaqtim bo'lganida, kelardim.
<br><br>O'zbek tilidagi <code>-sa</code> qo'shimchasiga to'liq mos keladi: "kelsam, kelsang, kelsa".`,
ex:[["Param olsa, araba alırım.","Pulim bo'lsa, mashina olaman."],["Gelsen çok sevinirim.","Kelsang juda xursand bo'laman."],["Hava güzel olsa, yürüyüşe çıkarız.","Havo chiroyli bo'lsa, sayrga chiqamiz."],["Vaktim olsaydı, gelirdim.","Vaqtim bo'lganida, kelardim."],["Çalışsan başarılı olursun.","Ishlasang muvaffaqiyatli bo'lasan."],["Bilseydim söylerdim.","Bilganimda aytardim."],["Sınavı geçseydim mutlu olurdum.","Imtihondan o'tganimda baxtli bo'lardim."],["Ne istersen yaparım.","Nima istasang qilaman."]]
},
{
id:'b2-2', lvl:'B2', n:2, tr:'-dığı zaman / -dığında', uz:"«-gan paytda / -ganda»",
body:`Bu qurilish <b>"-gan paytda, -ganda"</b> ma'nosini beradi va asosiy harakat vaqtini bildiradi.
<br><br><code>geldiğim zaman / geldiğimde</code> — kelganimda<br>
<code>geldiğin zaman / geldiğinde</code> — kelganingda<br>
<code>geldiği zaman / geldiğinde</code> — kelganida<br>
<code>geldiğimiz zaman / geldiğimizde</code> — kelganimizda<br>
<code>geldiğiniz zaman / geldiğinizde</code> — kelganingizda<br>
<code>geldikleri zaman / geldiklerinde</code> — kelganlarida
<br><br><b>Shakli:</b> fe'l o'zagi + <code>-dığı / -diği / -duğu / -düğü</code> + <code>zaman</code> yoki egalik qo'shimchasi + <code>-de</code>.
<br><br>O'zbek tilidagi "-ganimda, -ganingda, -ganida" qo'shimchalariga to'liq mos keladi.`,
ex:[["Okula geldiğimde kimse yoktu.","Maktabga kelganimda hech kim yo'q edi."],["Onu gördüğüm zaman çok sevindim.","Uni ko'rganimda juda xursand bo'ldim."],["Yemek yediğimizde konuştuk.","Ovqat yeganımızda gaplashdik."],["Sen uyuduğunda saat kaçtı?","Sen uxlaganingda soat necha edi?"],["Türkiye'ye geldiğimde Türkçe bilmiyordum.","Turkiyaga kelganimda turkcha bilmasdim."],["Haber aldığımızda hemen yola çıktık.","Xabar olganimizda darhol yo'lga chiqdik."],["Toplantı bittiğinde herkes gitti.","Yig'ilish tugaganida hamma ketdi."],["Bunu duyduğumda şaşırdım.","Buni eshitganimda hayron bo'ldim."]]
},
{
id:'b2-3', lvl:'B2', n:3, tr:'Dolaylı Anlatım (Direct / Indirect Speech)', uz:"Bilvosita nutq",
body:`Boshqaning gapini <b>o'zgartirib</b> yetkazish bilvosita nutq deyiladi.
<br><br><b>To'g'ri nutq:</b> <code>Ali: "Yarın geleceğim" dedi.</code><br>
<b>Bilvosita nutq:</b> <code>Ali yarın geleceğini söyledi.</code> — Ali ertaga kelishini aytdi.
<br><br><b>Asosiy qoliplar:</b><br>
• <code>-dığını söyledi</code> — "-ganini aytdi"<br>
<code>Geldiğini söyledi.</code> — Kelganini aytdi.<br>
• <code>-acağını söyledi</code> — "-ishini aytdi"<br>
<code>Geleceğini söyledi.</code> — Kelishini aytdi.<br>
• <code>-ıp sormadı / sordu</code> — so'radi<br>
<code>Nerede olduğunu sordu.</code> — Qayerda ekanini so'radi.<br>
• <code>isteğini / gerektiğini söyledi</code> — xohishini aytdi
<br><br>O'zbek tilidagi "-ganini aytdi", "-ishini aytdi" qurilishlariga mos keladi.`,
ex:[["Ali yarın geleceğini söyledi.","Ali ertaga kelishini aytdi."],["Hasta olduğunu söyledi.","Kasal ekanini aytdi."],["Nerede oturduğunu sordu.","Qayerda o'tirishini so'radi."],["Beni sevdiğini söyledi.","Meni sevishini aytdi."],["Türkçe öğrendiğini söyledi.","Turkcha o'rganganini aytdi."],["Yardım etmemi istedi.","Yordam berishimni xohladi."],["Evde olmadığını söyledi.","Uyda emasligini aytdi."],["Ne zaman döneceğini bilmiyorum.","Qachon qaytishini bilmayman."]]
},
{
id:'b2-4', lvl:'B2', n:4, tr:'-dığı halde / -masına rağmen', uz:"«-ganiga qaramasdan / -ishiga qaramasdan»",
body:`Bu qurilishlar <b>qarama-qarshilik</b>ni bildiradi: "shunday bo'lsa-da, lekin".
<br><br><b>-dığı halde</b> — "-ganiga qaramasdan":<br>
<code>Hasta olduğu halde işe geldi.</code> — Kasal bo'lganiga qaramasdan ishga keldi.
<br><br><b>-masına rağmen</b> — "-ishiga qaramasdan":<br>
<code>Yağmur yağmasına rağmen dışarı çıktık.</code> — Yomg'ir yog'ishiga qaramasdan tashqariga chiqdik.
<br><br>Ikkisi ham <b>bir xil ma'no</b> beradi, lekin <code>-masına rağmen</code> ko'proq ishlatiladi va fe'lning inkor shakli bilan yasaladi.
<br><br>O'zbek tilidagi "-ga qaramasdan" qurilishiga to'liq mos keladi.`,
ex:[["Hasta olduğu halde işe geldi.","Kasal bo'lganiga qaramasdan ishga keldi."],["Yorgun olmasına rağmen çalışmaya devam etti.","Charchagan bo'lishiga qaramasdan ishlashda davom etdi."],["Yağmur yağmasına rağmen dışarı çıktık.","Yomg'ir yog'ishiga qaramasdan tashqariga chiqdik."],["Zengin olduğu halde mutlu değil.","Boy bo'lganiga qaramasdan baxtli emas."],["Çok çalışmasına rağmen başaramadı.","Juda ko'p ishlashiga qaramasdan uddalay olmadi."],["Genç olmasına rağmen çok tecrübeli.","Yosh bo'lishiga qaramasdan juda tajribali."],["Türkçe bilmesine rağmen konuşmuyor.","Turkcha bilishiga qaramasdan gaplashmaydi."],["Geç olmasına rağmen geldi.","Kech bo'lishiga qaramasdan keldi."]]
},
{
id:'b2-5', lvl:'B2', n:5, tr:'-mış olmalı / -mış olabilir (Olasılık)', uz:"Ehtimollik: «-gan bo'lishi kerak / mumkin»",
body:`Turk tilida <b>taxmin va ehtimollik</b>ni bildirishning muhim usullari:
<br><br><b>-mış olmalı</b> — "-gan bo'lishi kerak" (kuchli taxmin):<br>
<code>O şimdi evde olmalı.</code> — U hozir uyda bo'lishi kerak.<br>
<code>Uyumuş olmalı.</code> — Uxlab qolgan bo'lishi kerak.
<br><br><b>-mış olabilir</b> — "-gan bo'lishi mumkin" (ehtimol):<br>
<code>Geç kalmış olabilir.</code> — Kech qolgan bo'lishi mumkin.
<br><br><b>-abilir</b> — "-ishi mumkin":<br>
<code>Yarın gelebilir.</code> — Ertaga kelishi mumkin.
<br><br><b>Inkor taxmin:</b> <code>olmaz / olamaz</code>:<br>
<code>Bu doğru olamaz.</code> — Bu to'g'ri bo'lishi mumkin emas.
<br><br>O'zbek tilidagi "bo'lishi kerak", "bo'lishi mumkin" qurilishlariga mos keladi.`,
ex:[["O şimdi evde olmalı.","U hozir uyda bo'lishi kerak."],["Uyumuş olmalı.","Uxlab qolgan bo'lishi kerak."],["Geç kalmış olabilir.","Kech qolgan bo'lishi mumkin."],["Yarın gelebilir.","Ertaga kelishi mumkin."],["Bu doğru olamaz.","Bu to'g'ri bo'lishi mumkin emas."],["Onlar tatilde olmalı.","Ular ta'tilda bo'lishi kerak."],["Parasını kaybetmiş olabilir.","Pulini yo'qotgan bo'lishi mumkin."],["Hasta olmalı, rengi solgun.","Kasal bo'lishi kerak, rangi oqargan."]]
},
{
id:'b2-6', lvl:'B2', n:6, tr:'-mak zorunda olmak / -ması gerekmek', uz:"Majburiyat: «-ishga majbur / -ishi kerak»",
body:`Majburiyatni bildirishning ikki darajasi bor:
<br><br><b>1) -mak zorunda olmak</b> — "-ishga majbur bo'lmoq" (kuchli majburiyat):<br>
<code>Her gün çalışmak zorundayım.</code> — Har kuni ishlashga majburman.<br>
<code>Erken kalkmak zorunda kaldı.</code> — Erta turishga majbur bo'ldi.
<br><br><b>2) -ması gerekmek</b> — "-ishi kerak" (rasmiy, yumshoqroq):<br>
<code>Formu doldurmanız gerekiyor.</code> — Formani to'ldirishingiz kerak.<br>
<code>Bu konuyu konuşmamız gerekiyor.</code> — Bu mavzuni gaplashishimiz kerak.
<br><br>O'zbek tilidagi "majburman" va "kerak" so'zlariga mos keladi.`,
ex:[["Her gün çalışmak zorundayım.","Har kuni ishlashga majburman."],["Erken kalkmak zorunda kaldı.","Erta turishga majbur bo'ldi."],["Formu doldurmanız gerekiyor.","Formani to'ldirishingiz kerak."],["Bu konuyu konuşmamız gerekiyor.","Bu mavzuni gaplashishimiz kerak."],["Ona gerçeği söylemek zorundayım.","Unga haqiqatni aytishga majburman."],["Daha dikkatli olman gerekiyor.","Ko'proq ehtiyot bo'lishing kerak."],["Bilet almak zorundayız.","Chipta olishga majburmiz."],["Erken yatması gerekiyor.","Erta yotishi kerak."]]
}
];
